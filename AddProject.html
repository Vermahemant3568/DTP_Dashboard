<div class="space-y-6 page-enter">

  <div class="flex items-center gap-3">
    <button onclick="loadPage('projects')" class="p-2 rounded-xl hover:bg-gray-100 text-gray-500 transition-colors">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
    </button>
    <div>
      <h2 id="addProjectTitle" class="text-2xl font-bold text-gray-800">Register New Project</h2>
      <p class="text-sm text-gray-500 mt-0.5">Create a master project record. Add tasks separately after registration.</p>
    </div>
  </div>

  <form id="projectForm" class="space-y-5">

    <!-- PROJECT INFO -->
    <div class="section-card">
      <div class="section-header border-l-blue-500 bg-blue-50">
        <div class="h-9 w-9 rounded-xl bg-blue-100 flex items-center justify-center text-lg">📁</div>
        <div>
          <h3 class="text-base font-semibold text-blue-700">Project Information</h3>
          <p class="text-xs text-blue-400">Basic project and client details</p>
        </div>
      </div>
      <div class="section-body">
        <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
          <div>
            <label class="label">Client Name *</label>
            <input id="proj_clientName" class="input" placeholder="Enter client/company name" required>
          </div>
          <div>
            <label class="label">Project Name *</label>
            <input id="proj_projectName" class="input" placeholder="Enter project title" required>
          </div>
          <div>
            <label class="label">Project Coordinator</label>
            <input id="proj_coordinator" class="input" placeholder="Coordinator name">
          </div>
          <div>
            <label class="label">Priority</label>
            <select id="proj_priority" class="input">
              <option>Low</option>
              <option selected>Medium</option>
              <option>High</option>
              <option>Urgent</option>
            </select>
          </div>
          <div>
            <label class="label">Status</label>
            <select id="proj_status" class="input">
              <option value="Active">Active</option>
              <option value="Pending">Pending</option>
              <option value="On Hold">On Hold</option>
              <option value="Completed">Completed</option>
              <option value="Cancelled">Cancelled</option>
            </select>
          </div>
          <div>
            <label class="label">Received Date</label>
            <input type="date" id="proj_receivedDate" class="input">
          </div>
        </div>
      </div>
    </div>

    <!-- LANGUAGE & PAGES -->
    <div class="section-card">
      <div class="section-header border-l-purple-500 bg-purple-50">
        <div class="h-9 w-9 rounded-xl bg-purple-100 flex items-center justify-center text-lg">🌍</div>
        <div>
          <h3 class="text-base font-semibold text-purple-700">Language & Scope</h3>
          <p class="text-xs text-purple-400">Source language, target languages, and page scope</p>
        </div>
      </div>
      <div class="section-body">
        <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-4">
          <div>
            <label class="label">Source Language</label>
            <input id="proj_sourceLanguage" class="input" value="English">
          </div>
          <div>
            <label class="label">Target Languages</label>
            <input id="proj_targetLanguages" class="input" placeholder="French, German, Spanish">
            <p class="text-xs text-gray-400 mt-1">Comma-separated</p>
          </div>
          <div>
            <label class="label">Language Count</label>
            <input type="number" id="proj_langCount" class="input" placeholder="e.g. 5" min="0">
          </div>
          <div>
            <label class="label">Source Pages</label>
            <input type="number" id="proj_sourcePages" class="input" placeholder="e.g. 20" min="0">
          </div>
          <div>
            <label class="label">Word Count</label>
            <input type="number" id="proj_wordCount" class="input" placeholder="e.g. 5000" min="0">
          </div>
        </div>
      </div>
    </div>

    <!-- NOTES -->
    <div class="section-card">
      <div class="section-header border-l-gray-400 bg-gray-50">
        <div class="h-9 w-9 rounded-xl bg-gray-200 flex items-center justify-center text-lg">📝</div>
        <div>
          <h3 class="text-base font-semibold text-gray-700">Notes</h3>
          <p class="text-xs text-gray-500">Project notes, instructions, or references</p>
        </div>
      </div>
      <div class="section-body">
        <textarea id="proj_notes" rows="3" class="input" placeholder="Project notes, delivery instructions, special requirements…"></textarea>
      </div>
    </div>

    <!-- SUBMIT -->
    <div class="sticky bottom-0 bg-white/90 backdrop-blur-sm border-t border-gray-200 px-4 py-3 rounded-2xl flex justify-end gap-3">
      <button type="button" onclick="loadPage('projects')"
        class="px-5 py-2.5 text-sm font-semibold text-gray-500 hover:bg-gray-100 rounded-xl transition-colors">
        Cancel
      </button>
      <button type="submit" id="projSubmitBtn"
        class="inline-flex items-center gap-2 rounded-xl bg-blue-600 px-6 py-2.5 text-sm font-semibold text-white shadow-md hover:bg-blue-700 active:scale-[0.98] transition-all">
        <span id="projSubmitIcon">🚀</span>
        <span id="projSubmitLabel">Register Project</span>
      </button>
    </div>

  </form>
</div>
