<script>
/* ================================================================
   ScriptVendorView.html — Vendor Performance Page Logic
================================================================ */
var _vvVendorName = "";
var _vvData       = null;

/* ── Entry point: called from ScriptNav when page = vendorView ── */
function loadVendorView(vendorName) {
  _vvVendorName = vendorName || "";
  _vvInitYearFilter();
  _vvFetch();
}

function _vvInitYearFilter() {
  var el = document.getElementById("vv_fYear");
  if (!el || el.options.length > 1) return;
  var now = new Date().getFullYear();
  for (var y = now; y >= now - 4; y--) {
    var o = document.createElement("option");
    o.value = y; o.text = y;
    if (y === now) o.selected = true;
    el.appendChild(o);
  }
}

function vvApplyFilter() { _vvFetch(); }

function _vvGetFilters() {
  return {
    month:     _val("vv_fMonth")   || "",
    year:      _val("vv_fYear")    || "",
    projectId: _val("vv_fProject") || "",
    language:  _val("vv_fLang")    || "",
    status:    _val("vv_fStatus")  || ""
  };
}

function _vvFetch() {
  if (!_vvVendorName) { hideLoader(); return; }
  showLoader("Loading vendor performance…");
  var filters = _vvGetFilters();
  /* Strip empty strings so backend treats them as "no filter" */
  Object.keys(filters).forEach(function(k) { if (!filters[k]) delete filters[k]; });
  google.script.run
    .withFailureHandler(function(e) { hideLoader(); showToast("Error: " + e.message, "error"); })
    .withSuccessHandler(function(data) {
      hideLoader();
      _vvData = data;
      _vvRender(data);
    })
    .getVendorPerformance(_vvVendorName, filters);
}

function _vvRender(d) {
  if (!d) return;
  var v = d.vendor || {};
  var s = d.stats  || {};

  /* ── Header ── */
  _set("vv_title",    v.name || _vvVendorName);
  _set("vv_subtitle", (v.specialization || "Vendor") + " · " + (v.status || "Active"));

  /* ── Info card ── */
  _set("vv_name",    v.name || "—");
  _set("vv_contact", v.contactPerson || "—");
  _set("vv_email",   v.email || "—");
  _set("vv_phone",   v.phone || "—");
  _set("vv_langs",   v.languages || "—");
  _set("vv_rate",    (v.ratePerPage || 0).toLocaleString() + " " + (v.currency || "INR") + " / page");

  var sb = document.getElementById("vv_statusBadge");
  if (sb) {
    sb.className = "badge " + (v.status === "Active" ? "bg-green-100 text-green-700" : "bg-gray-100 text-gray-500");
    sb.innerText = v.status || "Active";
  }
  var spb = document.getElementById("vv_specBadge");
  if (spb) spb.innerText = v.specialization || "—";

  var cur = v.currency || s.currency || "";

  /* ── Stat cards ── */
  _set("vv_totalAssigned",  (s.totalAssigned  || 0).toLocaleString());
  _set("vv_completedPages", (s.completedPages || 0).toLocaleString());
  _set("vv_pendingPages",   (s.pendingPages   || 0).toLocaleString());
  _set("vv_estAmount",      cur + " " + (s.totalAmount || 0).toLocaleString());

  /* ── Payment breakdown ── */
  _set("vv_taskPages",    (s.taskPages || 0).toLocaleString() + " pages");
  _set("vv_revPages",     (s.revPages  || 0).toLocaleString() + " pages");
  _set("vv_paidAmt",      cur + " " + (s.paidAmount    || 0).toLocaleString());
  _set("vv_partialAmt",   cur + " " + (s.partialAmount || 0).toLocaleString());
  _set("vv_unpaidAmt",    cur + " " + (s.unpaidAmount  || 0).toLocaleString());
  _set("vv_totalAmt",     cur + " " + (s.totalAmount   || 0).toLocaleString());
  /* legacy IDs kept for compatibility */
  _set("vv_payCompletedPages", (s.completedPages || 0).toLocaleString() + " pages");
  _set("vv_payCompletedAmt",   cur + " " + (s.paidAmount    || 0).toLocaleString());
  _set("vv_payPendingPages",   (s.pendingPages   || 0).toLocaleString() + " pages");
  _set("vv_payPendingAmt",     cur + " " + (s.unpaidAmount  || 0).toLocaleString());
  _set("vv_payPartialAmt",     cur + " " + (s.partialAmount || 0).toLocaleString());
  _set("vv_payTotalPages",     (s.totalPages     || 0).toLocaleString() + " pages");
  _set("vv_payTotalAmt",       cur + " " + (s.totalAmount   || 0).toLocaleString());

  /* ── Populate filter dropdowns (only on first load) ── */
  _vvPopulateDropdowns(d.projectOptions || [], d.langOptions || []);

  /* ── Monthly chart ── */
  _vvRenderMonthly(d.monthly || []);

  /* ── Breakdown bars ── */
  _vvRenderBars("vv_byProject",  d.byProject  || [], "projectName", "pages", "bg-sky-500");
  _vvRenderBars("vv_byTaskType", d.byTaskType || [], "type",        "pages", "bg-violet-500");
  _vvRenderBars("vv_byLanguage", d.byLanguage || [], "language",    "pages", "bg-teal-500");

  /* ── Work table ── */
  _vvRenderTable(d.rows || []);
}

function _vvPopulateDropdowns(projects, langs) {
  var pEl = document.getElementById("vv_fProject");
  if (pEl && pEl.options.length <= 1) {
    projects.forEach(function(p) {
      var o = document.createElement("option");
      o.value = p.id; o.text = p.name;
      pEl.appendChild(o);
    });
  }
  var lEl = document.getElementById("vv_fLang");
  if (lEl && lEl.options.length <= 1) {
    langs.forEach(function(l) {
      var o = document.createElement("option");
      o.value = l; o.text = l;
      lEl.appendChild(o);
    });
  }
}

function _vvRenderMonthly(monthly) {
  var el = document.getElementById("vv_monthlyChart");
  if (!el) return;
  if (!monthly.length) {
    el.innerHTML = '<p class="text-sm text-slate-400 text-center py-4">No monthly data available.</p>';
    return;
  }
  var max = Math.max.apply(null, monthly.map(function(m) { return m.pages; })) || 1;
  el.innerHTML = monthly.map(function(m) {
    var pct = Math.round(m.pages / max * 100);
    return '<div class="flex items-center gap-3">' +
      '<span class="text-[11px] text-slate-500 w-20 shrink-0 text-right">' + m.label + '</span>' +
      '<div class="flex-1 bg-slate-100 rounded-full h-5 overflow-hidden">' +
        '<div class="bg-emerald-500 h-5 rounded-full flex items-center justify-end pr-2 transition-all duration-700" style="width:' + Math.max(pct, 2) + '%">' +
          (pct > 8 ? '<span class="text-[10px] font-bold text-white">' + m.pages.toLocaleString() + '</span>' : '') +
        '</div>' +
      '</div>' +
      (pct <= 8 ? '<span class="text-[11px] font-bold text-slate-600 shrink-0">' + m.pages.toLocaleString() + '</span>' : '') +
    '</div>';
  }).join("");
}

function _vvRenderBars(containerId, items, labelKey, valueKey, colorClass) {
  var el = document.getElementById(containerId);
  if (!el) return;
  if (!items.length) {
    el.innerHTML = '<p class="text-sm text-slate-400 text-center py-4">No data.</p>';
    return;
  }
  var max = Math.max.apply(null, items.map(function(i) { return i[valueKey]; })) || 1;
  el.innerHTML = items.slice(0, 8).map(function(i) {
    var sub = (i.count !== undefined) ? (i[valueKey].toLocaleString() + " pages · " + i.count + " task" + (i.count !== 1 ? "s" : "")) : (i[valueKey].toLocaleString() + " pages");
    return buildBar(i[labelKey], i[valueKey], max, colorClass, sub);
  }).join("<div class='mt-3'></div>");
}

function _vvRenderTable(rows) {
  var tbody = document.getElementById("vv_workTable");
  var countEl = document.getElementById("vv_tableCount");
  if (!tbody) return;
  if (countEl) countEl.innerText = rows.length + " record" + (rows.length !== 1 ? "s" : "");
  if (!rows.length) {
    tbody.innerHTML = '<tr><td colspan="10" class="py-12 text-center text-slate-400 text-sm">No work records found for the selected filters.</td></tr>';
    return;
  }
  tbody.innerHTML = rows.map(function(r) {
    var sc  = getStatusClass(r.status || "Pending");
    var tc  = r.type === "revision" ? "bg-purple-100 text-purple-700" : getTaskClass(r.taskType || "Main DTP");
    var pc  = r.paymentStatus === "Paid"    ? "bg-green-100 text-green-700" :
              r.paymentStatus === "Partial" ? "bg-yellow-100 text-yellow-700" :
              r.paymentStatus === "N/A"     ? "bg-gray-100 text-gray-400" :
                                             "bg-red-50 text-red-600";
    var rateStr = r.ratePerPage ? (r.currency || "") + " " + Number(r.ratePerPage).toLocaleString() : "—";
    var amtStr  = (r.amount !== undefined && r.ratePerPage) ? (r.currency || "") + " " + Number(r.amount).toLocaleString() : "—";
    return '<tr>' +
      '<td class="font-mono text-[11px] text-gray-400">' + (r.id || "—") + '</td>' +
      '<td class="text-sm font-semibold text-gray-800 max-w-[140px] truncate">' + (r.projectName || "—") + '</td>' +
      '<td><span class="badge ' + tc + '">' + (r.taskType || "—") + '</span></td>' +
      '<td class="text-sm text-gray-600">' + (r.language || "—") + '</td>' +
      '<td class="text-center text-sm font-black text-sky-700">' + (r.pages || 0).toLocaleString() + '</td>' +
      '<td class="text-sm text-gray-600 text-right">' + rateStr + '</td>' +
      '<td class="text-sm font-semibold text-emerald-700 text-right">' + amtStr + '</td>' +
      '<td><span class="badge ' + sc + '">' + (r.status || "—") + '</span></td>' +
      '<td><span class="badge ' + pc + '">' + (r.paymentStatus || "—") + '</span></td>' +
      '<td class="text-sm text-gray-500">' + (r.completedDate || "—") + '</td>' +
    '</tr>';
  }).join("");
}
</script>
