<script>
/* ================================================================
   ScriptVendors.html
================================================================ */
var ALL_VENDORS  = [];
var _editVendorId = "";

function loadVendors() {
  showLoader("Loading vendors...");
  google.script.run
    .withFailureHandler(function(e){ hideLoader(); showToast("Could not load vendors: "+e.message,"error"); })
    .withSuccessHandler(function(data){
      ALL_VENDORS=data||[];
      _renderVendorsTable(ALL_VENDORS);
      hideLoader();
    })
    .getVendors();
}

function _renderVendorsTable(data) {
  var tbody=document.getElementById("vendorsTable");
  if (!tbody) return;
  if (!data.length){
    tbody.innerHTML='<tr><td colspan="9" class="py-16 text-center text-slate-400 text-sm">No vendors yet.</td></tr>';
    return;
  }
  tbody.innerHTML=data.map(function(r){
    var sc=r[9]==="Active"?"bg-green-100 text-green-700":"bg-gray-100 text-gray-500";
    return '<tr>'+
      '<td class="font-mono text-[11px] text-gray-400">'+r[0]+'</td>'+
      '<td class="font-semibold text-gray-900 text-sm">'+(r[1]||"—")+'</td>'+
      '<td class="text-sm text-gray-600">'+(r[2]||"—")+'</td>'+
      '<td class="text-sm text-gray-600">'+(r[3]||"—")+'</td>'+
      '<td class="text-sm text-gray-600">'+(r[5]||"—")+'</td>'+
      '<td class="text-sm text-gray-600">'+(r[6]||"—")+'</td>'+
      '<td class="text-center text-sm font-semibold text-gray-700">'+(r[7]||0)+' '+(r[8]||"")+'</td>'+
      '<td><span class="badge '+sc+'">'+(r[9]||"Active")+'</span></td>'+
      '<td class="text-right">'+
        '<div class="flex justify-end gap-1">'+
          btnEdit(r[0],"openVendorModal")+
          btnDelete(r[0],"deleteVendorById")+
        '</div>'+
      '</td>'+
    '</tr>';
  }).join("");
}

function openVendorModal(id) {
  _editVendorId=id||"";
  var modal=document.getElementById("vendorModal");
  if (!modal) return;
  document.getElementById("vendorModalTitle").innerText=id?"Edit Vendor":"Add Vendor";
  if (id){
    var v=ALL_VENDORS.find(function(r){ return r[0]===id; });
    if (v){
      _setVal("vm_name",v[1]); _setVal("vm_contact",v[2]); _setVal("vm_email",v[3]);
      _setVal("vm_phone",v[4]); _setVal("vm_spec",v[5]); _setVal("vm_langs",v[6]);
      _setVal("vm_rate",v[7]); _setVal("vm_currency",v[8]); _setVal("vm_status",v[9]); _setVal("vm_notes",v[10]);
    }
  } else {
    ["vm_name","vm_contact","vm_email","vm_phone","vm_spec","vm_langs","vm_rate","vm_notes"].forEach(function(i){ _setVal(i,""); });
    _setVal("vm_currency","USD"); _setVal("vm_status","Active");
  }
  modal.style.display="flex";
}

function closeVendorModal() {
  var modal=document.getElementById("vendorModal");
  if (modal) modal.style.display="none";
  _editVendorId="";
}

function saveVendor() {
  var name=_val("vm_name");
  if (!name){ showToast("Vendor name is required.","error"); return; }
  var d={
    vendorName:    name,
    contactPerson: _val("vm_contact"),
    email:         _val("vm_email"),
    phone:         _val("vm_phone"),
    specialization:_val("vm_spec"),
    languages:     _val("vm_langs"),
    ratePerPage:   _val("vm_rate"),
    currency:      _val("vm_currency"),
    status:        _val("vm_status"),
    notes:         _val("vm_notes")
  };
  showLoader("Saving vendor...");
  if (_editVendorId){
    google.script.run
      .withFailureHandler(function(e){ hideLoader(); showToast("Error: "+e.message,"error"); })
      .withSuccessHandler(function(){ hideLoader(); closeVendorModal(); showToast("Vendor updated!","success"); loadVendors(); })
      .updateVendor(_editVendorId,d);
  } else {
    google.script.run
      .withFailureHandler(function(e){ hideLoader(); showToast("Error: "+e.message,"error"); })
      .withSuccessHandler(function(){ hideLoader(); closeVendorModal(); showToast("Vendor added!","success"); loadVendors(); })
      .addVendor(d);
  }
}

function deleteVendorById(id) {
  customConfirm("Delete vendor "+id+"? This cannot be undone.", function(){
    showLoader("Deleting...");
    google.script.run
      .withFailureHandler(function(e){ hideLoader(); showToast("Delete failed: "+e.message,"error"); })
      .withSuccessHandler(function(){ hideLoader(); showToast("Vendor deleted.","warning"); loadVendors(); })
      .deleteVendor(id);
  }, true);
}
</script>
