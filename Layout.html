<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <script src="https://cdn.tailwindcss.com"></script>
  <?!= include('Styles'); ?>
</head>

<body>

  <?!= include('Header'); ?>

  <div class="flex">

    <?!= include('Sidebar'); ?>

    <main class="flex-1 ml-64 min-h-screen bg-gray-50 p-6 transition-all duration-300" id="mainContent">
      <div id="contentArea" class="max-w-7xl mx-auto">
        <?!= include('Dashboard'); ?>
      </div>
    </main>

  </div>

  <!-- ════════════════════════════════════════
       GLOBAL LOADER
       Uses flex for centering; toggled via style.display
  ════════════════════════════════════════ -->
  <div id="globalLoader"
       style="display:none"
       class="fixed inset-0 z-[5000] flex flex-col items-center justify-center bg-slate-900/40 backdrop-blur-sm">
    <div class="flex flex-col items-center px-10 py-8 bg-white rounded-2xl shadow-2xl border border-slate-100">
      <div class="relative h-11 w-11">
        <div class="absolute inset-0 rounded-full border-4 border-slate-100"></div>
        <div class="absolute inset-0 rounded-full border-4 border-sky-600 border-t-transparent animate-spin"></div>
      </div>
      <p class="mt-4 text-sm font-bold text-slate-700 tracking-wide uppercase">Processing…</p>
    </div>
  </div>

  <!-- ════════════════════════════════════════
       QUICK EDIT MODAL
  ════════════════════════════════════════ -->
  <div id="editModal"
       class="fixed inset-0 z-[2000] hidden items-center justify-center bg-black/50 px-4"
       style="display:none">
    <div class="w-full max-w-md rounded-xl bg-white shadow-2xl">

      <div class="flex items-center justify-between border-b border-gray-100 p-4">
        <h3 class="text-lg font-bold text-gray-800">Quick Update</h3>
        <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 transition-colors">✕</button>
      </div>

      <div class="p-6 space-y-4">

        <div class="rounded-lg bg-sky-50 p-3">
          <p class="text-[10px] font-bold uppercase tracking-wider text-sky-500">Project</p>
          <p id="m_projectName" class="mt-0.5 text-sm font-semibold text-sky-900">—</p>
          <p id="m_projectId"   class="mt-0.5 font-mono text-[10px] text-sky-400"></p>
        </div>

        <div>
          <label class="mb-1 block text-xs font-semibold text-gray-500">Status</label>
          <select id="m_status"
                  class="w-full rounded-lg border border-gray-200 p-2 text-sm outline-none focus:border-sky-400 focus:ring-2 focus:ring-sky-100 transition-all">
            <option value="Pending">Pending</option>
            <option value="In Progress">In Progress</option>
            <option value="On Hold">On Hold</option>
            <option value="Completed">Completed</option>
          </select>
        </div>

        <div>
          <label class="mb-1 block text-xs font-semibold text-gray-500">Delivery Date</label>
          <input type="date" id="m_deliveryDate"
                 class="w-full rounded-lg border border-gray-200 p-2 text-sm outline-none focus:border-sky-400 focus:ring-2 focus:ring-sky-100 transition-all">
          <p class="mt-1 text-[10px] text-amber-500">
            ✱ "Mark as Complete" sets this to today automatically.
          </p>
        </div>

      </div>

      <div class="flex flex-col gap-2 border-t border-gray-100 p-4">
        <button onclick="saveQuickUpdate()"
                class="w-full rounded-lg bg-sky-600 py-2.5 text-sm font-bold text-white hover:bg-sky-700 transition-colors">
          Save Changes
        </button>
        <button onclick="markAsCompleteNow()"
                class="w-full rounded-lg border border-green-500 bg-green-50 py-2.5 text-sm font-bold text-green-700 hover:bg-green-100 transition-colors">
          ✅ Mark as Complete Now
        </button>
      </div>

    </div>
  </div>

  <!-- ════════════════════════════════════════
       CONFIRM MODAL
  ════════════════════════════════════════ -->
<div id="confirmModal"
     style="display:none"
     class="fixed inset-0 z-[4000] flex items-center justify-center bg-black/50 backdrop-blur-sm px-4">
  <div class="w-full max-w-sm rounded-xl bg-white p-6 shadow-2xl">
    <div class="mb-3 flex items-center gap-3">
      <span class="text-2xl">⚠️</span>
      <h3 class="text-lg font-bold text-gray-800">Are you sure?</h3>
    </div>
    <p id="confirmMessage" class="mb-6 text-sm text-gray-500 leading-relaxed">
      Do you really want to perform this action?
    </p>
    <div class="flex justify-end gap-3">
      <button onclick="closeConfirmModal()"
              class="rounded-lg px-4 py-2 text-sm font-semibold text-gray-500 hover:bg-gray-100 transition-colors">
        Cancel
      </button>
      <button id="confirmBtnAction"
              class="rounded-lg bg-sky-600 px-5 py-2 text-sm font-semibold text-white hover:bg-sky-700 shadow-sm transition-colors">
        Yes, Proceed
      </button>
    </div>
  </div>
</div>

  <!-- ════════════════════════════════════════
       TOAST CONTAINER
  ════════════════════════════════════════ -->
  <div id="toast-container"
       class="fixed bottom-5 right-5 z-[3000] flex flex-col gap-3 pointer-events-none">
  </div>

  <?!= include('Scripts'); ?>

</body>
</html>
