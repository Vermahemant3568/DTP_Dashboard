<!DOCTYPE html>
<html lang="en">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <?!= include('Styles'); ?>
</head>
<body class="bg-gray-50 text-gray-900 antialiased" onload="initApp()">

  <?!= include('Header'); ?>

  <div class="flex">
    <?!= include('Sidebar'); ?>

    <main class="flex-1 ml-72 min-h-screen bg-gray-50 pt-20 pb-10 px-6 transition-all duration-300" id="mainContent">
      <div id="contentArea" class="max-w-7xl mx-auto"></div>
    </main>
  </div>

  <!-- GLOBAL LOADER -->
  <div id="globalLoader" style="display:none"
       class="fixed inset-0 z-[5000] flex flex-col items-center justify-center bg-slate-900/40 backdrop-blur-sm">
    <div class="flex flex-col items-center px-10 py-8 bg-white rounded-2xl shadow-2xl border border-slate-100">
      <div class="relative h-11 w-11">
        <div class="absolute inset-0 rounded-full border-4 border-slate-100"></div>
        <div class="absolute inset-0 rounded-full border-4 border-sky-600 border-t-transparent animate-spin"></div>
      </div>
      <p class="mt-4 text-sm font-bold text-slate-700 tracking-wide uppercase">Loading…</p>
    </div>
  </div>

  <!-- QUICK EDIT MODAL -->
  <div id="editModal" style="display:none"
       class="fixed inset-0 z-[2000] flex items-center justify-center bg-black/50 px-4">
    <div class="w-full max-w-md rounded-2xl bg-white shadow-2xl">
      <div class="flex items-center justify-between border-b border-gray-100 p-5">
        <h3 class="text-base font-bold text-gray-800">Quick Update</h3>
        <button onclick="closeEditModal()" class="text-gray-400 hover:text-gray-600 transition-colors text-lg leading-none">✕</button>
      </div>
      <div class="p-5 space-y-4">
        <div class="rounded-xl bg-sky-50 p-3 border border-sky-100">
          <p class="text-[10px] font-bold uppercase tracking-wider text-sky-500">Item</p>
          <p id="m_itemName" class="mt-0.5 text-sm font-semibold text-sky-900">—</p>
          <p id="m_itemId"   class="mt-0.5 font-mono text-[10px] text-sky-400"></p>
        </div>
        <div>
          <label class="label">Status</label>
          <select id="m_status" class="input">
            <option>Pending</option>
            <option>In Progress</option>
            <option>On Hold</option>
            <option>Completed</option>
          </select>
        </div>
        <div>
          <label class="label">Delivery Date</label>
          <input type="date" id="m_deliveryDate" class="input">
        </div>
      </div>
      <div class="flex flex-col gap-2 border-t border-gray-100 p-4">
        <button onclick="saveQuickEdit()"
          class="w-full rounded-xl bg-sky-600 py-2.5 text-sm font-bold text-white hover:bg-sky-700 transition-colors">
          Save Changes
        </button>
        <button onclick="markCompleteNow()"
          class="w-full rounded-xl border border-green-500 bg-green-50 py-2.5 text-sm font-bold text-green-700 hover:bg-green-100 transition-colors">
          ✅ Mark as Complete Now
        </button>
      </div>
    </div>
  </div>

  <!-- CONFIRM MODAL -->
  <div id="confirmModal" style="display:none"
       class="fixed inset-0 z-[4000] flex items-center justify-center bg-black/50 backdrop-blur-sm px-4">
    <div class="w-full max-w-sm rounded-2xl bg-white p-6 shadow-2xl">
      <div class="mb-3 flex items-center gap-3">
        <span class="text-2xl">⚠️</span>
        <h3 class="text-base font-bold text-gray-800">Are you sure?</h3>
      </div>
      <p id="confirmMessage" class="mb-6 text-sm text-gray-500 leading-relaxed">Do you really want to perform this action?</p>
      <div class="flex justify-end gap-3">
        <button onclick="closeConfirmModal()"
          class="rounded-xl px-4 py-2 text-sm font-semibold text-gray-500 hover:bg-gray-100 transition-colors">
          Cancel
        </button>
        <button id="confirmBtnAction"
          class="rounded-xl bg-sky-600 px-5 py-2 text-sm font-semibold text-white hover:bg-sky-700 shadow-sm transition-colors">
          Yes, Proceed
        </button>
      </div>
    </div>
  </div>

  <!-- TOAST CONTAINER -->
  <div id="toast-container" class="fixed bottom-5 right-5 z-[3000] flex flex-col gap-3 pointer-events-none"></div>

  <!-- VENDOR MODAL -->
  <div id="vendorModal" style="display:none"
    class="fixed inset-0 z-[6000] flex items-center justify-center bg-black/50 backdrop-blur-sm px-4">
    <div class="w-full max-w-lg rounded-2xl bg-white shadow-2xl flex flex-col max-h-[90vh]">
      <div class="flex items-center justify-between border-b border-gray-100 px-6 py-4 shrink-0">
        <div class="flex items-center gap-3">
          <div class="h-9 w-9 rounded-xl bg-emerald-100 flex items-center justify-center text-lg">🤝</div>
          <h3 id="vendorModalTitle" class="text-base font-bold text-gray-800">Add Vendor</h3>
        </div>
        <button onclick="closeVendorModal()" class="text-gray-400 hover:text-gray-600 text-xl leading-none transition-colors">✕</button>
      </div>
      <div class="overflow-y-auto p-6 grid grid-cols-2 gap-4">
        <div class="col-span-2">
          <label class="label">Vendor Name *</label>
          <input id="vm_name" class="input" placeholder="Vendor company or freelancer name">
        </div>
        <div>
          <label class="label">Contact Person</label>
          <input id="vm_contact" class="input" placeholder="Contact name">
        </div>
        <div>
          <label class="label">Email</label>
          <input type="email" id="vm_email" class="input" placeholder="email@example.com">
        </div>
        <div>
          <label class="label">Phone</label>
          <input id="vm_phone" class="input" placeholder="+91 98765 43210">
        </div>
        <div>
          <label class="label">Specialization</label>
          <input id="vm_spec" class="input" placeholder="e.g. DTP, Translation, QC">
        </div>
        <div>
          <label class="label">Languages</label>
          <input id="vm_langs" class="input" placeholder="e.g. French, German, Hindi">
        </div>
        <div>
          <label class="label">Rate Per Page</label>
          <input type="number" id="vm_rate" class="input" placeholder="0.00" min="0" step="0.01">
        </div>
        <div>
          <label class="label">Currency</label>
          <select id="vm_currency" class="input">
            <option>INR</option>
            <option>USD</option>
            <option>EUR</option>
            <option>GBP</option>
          </select>
        </div>
        <div>
          <label class="label">Status</label>
          <select id="vm_status" class="input">
            <option>Active</option>
            <option>Inactive</option>
          </select>
        </div>
        <div class="col-span-2">
          <label class="label">Notes</label>
          <textarea id="vm_notes" rows="2" class="input" placeholder="Additional notes…"></textarea>
        </div>
      </div>
      <div class="flex justify-end gap-3 border-t border-gray-100 px-6 py-4 shrink-0">
        <button onclick="closeVendorModal()"
          class="px-5 py-2.5 text-sm font-semibold text-gray-500 hover:bg-gray-100 rounded-xl transition-colors">
          Cancel
        </button>
        <button onclick="saveVendor()"
          class="px-5 py-2.5 text-sm font-semibold text-white bg-emerald-600 hover:bg-emerald-700 rounded-xl transition-colors">
          Save Vendor
        </button>
      </div>
    </div>
  </div>

  <!-- TEAM MODAL -->
  <div id="teamModal" style="display:none"
    class="fixed inset-0 z-[6000] flex items-center justify-center bg-black/50 backdrop-blur-sm px-4">
    <div class="w-full max-w-md rounded-2xl bg-white shadow-2xl flex flex-col max-h-[90vh]">
      <div class="flex items-center justify-between border-b border-gray-100 px-6 py-4 shrink-0">
        <div class="flex items-center gap-3">
          <div class="h-9 w-9 rounded-xl bg-sky-100 flex items-center justify-center text-lg">👤</div>
          <h3 id="teamModalTitle" class="text-base font-bold text-gray-800">Add Team Member</h3>
        </div>
        <button onclick="closeTeamModal()" class="text-gray-400 hover:text-gray-600 text-xl leading-none transition-colors">✕</button>
      </div>
      <div class="overflow-y-auto p-6 grid grid-cols-2 gap-4">
        <div class="col-span-2">
          <label class="label">Full Name *</label>
          <input id="tm_name" class="input" placeholder="Full name">
        </div>
        <div>
          <label class="label">Role</label>
          <input id="tm_role" class="input" placeholder="e.g. DTP Operator">
        </div>
        <div>
          <label class="label">Email</label>
          <input type="email" id="tm_email" class="input" placeholder="email@example.com">
        </div>
        <div>
          <label class="label">Phone</label>
          <input id="tm_phone" class="input" placeholder="+91 98765 43210">
        </div>
        <div>
          <label class="label">Specialization</label>
          <input id="tm_spec" class="input" placeholder="e.g. InDesign, Illustrator">
        </div>
        <div class="col-span-2">
          <label class="label">Status</label>
          <select id="tm_status" class="input">
            <option>Active</option>
            <option>Inactive</option>
          </select>
        </div>
      </div>
      <div class="flex justify-end gap-3 border-t border-gray-100 px-6 py-4 shrink-0">
        <button onclick="closeTeamModal()"
          class="px-5 py-2.5 text-sm font-semibold text-gray-500 hover:bg-gray-100 rounded-xl transition-colors">
          Cancel
        </button>
        <button onclick="saveTeamMember()"
          class="px-5 py-2.5 text-sm font-semibold text-white bg-sky-600 hover:bg-sky-700 rounded-xl transition-colors">
          Save Member
        </button>
      </div>
    </div>
  </div>

  <?!= include('ScriptProjects'); ?>

</body>
</html>
