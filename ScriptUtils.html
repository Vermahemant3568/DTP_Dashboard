<script>
/* ================================================================
   ScriptUtils.html — Shared Utilities
   Loader, Toast, Confirm Modal, Date Helpers, Status Classes
================================================================ */

/* ── LOADER ── */
function showLoader(msg) {
  const el = document.getElementById("globalLoader");
  if (!el) return;
  el.querySelector("p").innerText = msg || "Processing...";
  el.style.display = "flex";
}

function hideLoader() {
  const el = document.getElementById("globalLoader");
  if (el) el.style.display = "none";
}

/* ── TOAST ── */
function showToast(msg, type) {
  const cfg = {
    success: { bg: "bg-green-600",  icon: "✅" },
    error:   { bg: "bg-red-600",    icon: "❌" },
    warning: { bg: "bg-amber-500",  icon: "⚠️" },
    info:    { bg: "bg-sky-600",    icon: "ℹ️" }
  };
  const { bg, icon } = cfg[type] || cfg.info;
  const toast = document.createElement("div");
  toast.className = `flex items-center gap-3 px-4 py-3 rounded-xl text-white text-sm font-medium shadow-lg
                     transition-all duration-300 opacity-0 translate-y-2 ${bg}`;
  toast.innerHTML = `<span>${icon}</span><span>${msg}</span>`;
  document.getElementById("toast-container").appendChild(toast);
  requestAnimationFrame(() => requestAnimationFrame(() => {
    toast.classList.remove("opacity-0", "translate-y-2");
  }));
  setTimeout(() => {
    toast.classList.add("opacity-0", "translate-y-2");
    setTimeout(() => toast.remove(), 300);
  }, 3500);
}

/* ── CONFIRM MODAL ── */
function customConfirm(message, onConfirm) {
  const modal     = document.getElementById("confirmModal");
  const msgEl     = document.getElementById("confirmMessage");
  const actionBtn = document.getElementById("confirmBtnAction");
  msgEl.innerText     = message;
  modal.style.display = "flex";
  const fresh = actionBtn.cloneNode(true);
  actionBtn.replaceWith(fresh);
  fresh.addEventListener("click", function() {
    closeConfirmModal();
    onConfirm();
  });
}

function closeConfirmModal() {
  document.getElementById("confirmModal").style.display = "none";
}

/* ── DATE HELPERS ── */
function formatForInput(dateStr) {
  if (!dateStr || dateStr === "—") return "";
  if (/^\d{4}-\d{2}-\d{2}$/.test(dateStr)) return dateStr;
  const dmy = dateStr.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if (dmy) return `${dmy[3]}-${dmy[2].padStart(2,"0")}-${dmy[1].padStart(2,"0")}`;
  const d = new Date(dateStr);
  return isNaN(d) ? "" : d.toISOString().split("T")[0];
}

function todayISO() {
  return new Date().toISOString().split("T")[0];
}

/* ── STATUS CLASS HELPER ── */
function getStatusClass(status) {
  switch (status) {
    case "Completed":   return "bg-green-100 text-green-700 border border-green-200";
    case "In Progress": return "bg-blue-100 text-blue-700 border border-blue-200";
    case "Pending":     return "bg-yellow-100 text-yellow-700 border border-yellow-200";
    case "On Hold":     return "bg-red-100 text-red-700 border border-red-200";
    default:            return "bg-gray-100 text-gray-600 border border-gray-200";
  }
}

/* ── ELEMENT SETTER ── */
function _set(id, val) {
  const el = document.getElementById(id);
  if (el) el.innerText = val;
}
</script>
