<script>
/* ================================================================
   ScriptUtils.html — Shared constants, helpers, UI primitives
================================================================ */

var STATUS_COLORS = {
  "Pending":     "bg-yellow-100 text-yellow-700 border border-yellow-200",
  "In Progress": "bg-blue-100 text-blue-700 border border-blue-200",
  "Completed":   "bg-green-100 text-green-700 border border-green-200",
  "On Hold":     "bg-red-100 text-red-700 border border-red-200",
  "Active":      "bg-emerald-100 text-emerald-700 border border-emerald-200",
  "Cancelled":   "bg-gray-100 text-gray-500 border border-gray-200"
};

var TASK_COLORS = {
  "Main DTP":           "bg-blue-100 text-blue-700",
  "Pre-Engineering":    "bg-teal-100 text-teal-700",
  "Bilingual Creation": "bg-violet-100 text-violet-700",
  "Key Insertion of PDFs": "bg-green-100 text-green-700",
  "Others":             "bg-orange-100 text-orange-700"
};

var WORK_COLORS = {
  "In-House": "bg-sky-100 text-sky-700",
  "Vendor":   "bg-amber-100 text-amber-700"
};

function getStatusClass(s) { return STATUS_COLORS[s] || "bg-gray-100 text-gray-500 border border-gray-200"; }
function getTaskClass(t)   { return TASK_COLORS[t]   || "bg-gray-100 text-gray-600"; }
function getWorkClass(w)   { return WORK_COLORS[w]   || "bg-gray-100 text-gray-600"; }

/* ── ACTION BUTTONS (no inline SVG in JS strings) ── */
function btnView(id, fn)   { return '<button onclick="' + fn + '(\'' + id + '\')" title="View"   class="px-2 py-1 text-xs font-semibold text-blue-600 hover:bg-blue-50 rounded-lg transition-all">View</button>'; }
function btnEdit(id, fn)   { return '<button onclick="' + fn + '(\'' + id + '\')" title="Edit"   class="px-2 py-1 text-xs font-semibold text-amber-600 hover:bg-amber-50 rounded-lg transition-all">Edit</button>'; }
function btnDelete(id, fn) { return '<button onclick="' + fn + '(\'' + id + '\')" title="Delete" class="px-2 py-1 text-xs font-semibold text-red-500 hover:bg-red-50 rounded-lg transition-all">Del</button>'; }
function btnStatus(id, fn) { return '<button onclick="' + fn + '(\'' + id + '\')" title="Status" class="px-2 py-1 text-xs font-semibold text-sky-600 hover:bg-sky-50 rounded-lg transition-all">Status</button>'; }

/* ── LOADER ── */
function showLoader(msg) {
  var el = document.getElementById("globalLoader");
  if (!el) return;
  var p = el.querySelector("p");
  if (p) p.innerText = msg || "Processing...";
  el.style.display = "flex";
}
function hideLoader() {
  var el = document.getElementById("globalLoader");
  if (el) el.style.display = "none";
}

/* ── TOAST ── */
function showToast(msg, type) {
  var cfg = {
    success: { bg: "bg-green-600",  icon: "OK" },
    error:   { bg: "bg-red-600",    icon: "ERR" },
    warning: { bg: "bg-amber-500",  icon: "WARN" },
    info:    { bg: "bg-sky-600",    icon: "INFO" }
  };
  var c = cfg[type] || cfg.info;
  var t = document.createElement("div");
  t.className = "flex items-center gap-3 px-4 py-3 rounded-xl text-white text-sm font-medium shadow-lg transition-all duration-300 opacity-0 translate-y-2 pointer-events-auto " + c.bg;
  t.innerHTML = "<span class='font-bold text-xs'>" + c.icon + "</span><span>" + msg + "</span>";
  document.getElementById("toast-container").appendChild(t);
  requestAnimationFrame(function() {
    requestAnimationFrame(function() { t.classList.remove("opacity-0", "translate-y-2"); });
  });
  setTimeout(function() {
    t.classList.add("opacity-0", "translate-y-2");
    setTimeout(function() { t.remove(); }, 300);
  }, 3500);
}

/* ── CONFIRM MODAL ── */
function customConfirm(message, onConfirm, danger) {
  var modal  = document.getElementById("confirmModal");
  var msgEl  = document.getElementById("confirmMessage");
  var btn    = document.getElementById("confirmBtnAction");
  msgEl.innerText     = message;
  modal.style.display = "flex";
  var fresh = btn.cloneNode(true);
  btn.replaceWith(fresh);
  fresh.className = "rounded-xl px-5 py-2 text-sm font-semibold text-white shadow-sm transition-colors " +
    (danger ? "bg-red-600 hover:bg-red-700" : "bg-sky-600 hover:bg-sky-700");
  fresh.addEventListener("click", function() { closeConfirmModal(); onConfirm(); });
}
function closeConfirmModal() {
  document.getElementById("confirmModal").style.display = "none";
}

/* ── DATE HELPERS ── */
function todayISO() { return new Date().toISOString().split("T")[0]; }

function formatForInput(v) {
  if (!v || v === "—") return "";
  if (/^\d{4}-\d{2}-\d{2}$/.test(v)) return v;
  var dmy = v.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if (dmy) return dmy[3] + "-" + dmy[2].padStart(2,"0") + "-" + dmy[1].padStart(2,"0");
  var d = new Date(v);
  return isNaN(d) ? "" : d.toISOString().split("T")[0];
}

/* ── DOM HELPERS ── */
function _set(id, val) {
  var el = document.getElementById(id);
  if (el) el.innerText = (val === null || val === undefined || val === "") ? "—" : val;
}
function _val(id) {
  var el = document.getElementById(id);
  return el ? el.value.trim() : "";
}
function _setVal(id, val) {
  var el = document.getElementById(id);
  if (el) el.value = val || "";
}

/* ── REVISION DETAIL MODAL ── */
function openRevDetailModal(r) {
  /* r is the full revision array row */
  var sc  = getStatusClass(r[11] || "Pending");
  var wc  = getWorkClass(r[8]   || "In-House");
  var who = r[8] === "Vendor" ? (r[10] || r[9] || "—") : (r[9] || "—");
  var paid = r[20] === "Paid";
  var payC = paid ? "bg-emerald-100 text-emerald-700" : "bg-red-50 text-red-500";
  var rate = Number(r[18]) > 0 ? (r[19] ? r[19] + " " : "") + Number(r[18]).toLocaleString() + " /pg" : "—";

  document.getElementById("rdm_revId").innerText        = r[0] || "—";
  document.getElementById("rdm_revIdFooter").innerText  = r[0] || "—";
  document.getElementById("rdm_title").innerText        = (r[3] || r[1] || "—") + " · " + (r[4] || "") + (r[6] ? " · " + r[6] : "");
  document.getElementById("rdm_statusBadge").innerText  = r[11] || "Pending";
  document.getElementById("rdm_statusBadge").className  = "badge " + sc;
  document.getElementById("rdm_typeBadge").innerText    = r[5]  || "—";
  document.getElementById("rdm_workBadge").innerText    = r[8]  || "In-House";
  document.getElementById("rdm_workBadge").className    = "badge " + wc;
  document.getElementById("rdm_payBadge").innerText     = r[20] || "Unpaid";
  document.getElementById("rdm_payBadge").className     = "badge " + payC;
  document.getElementById("rdm_project").innerText      = (r[3] || r[1] || "—");
  document.getElementById("rdm_taskId").innerText       = r[2]  || "—";
  document.getElementById("rdm_language").innerText     = r[6]  || "—";
  document.getElementById("rdm_who").innerText          = who;
  document.getElementById("rdm_pages").innerText        = (Number(r[7]) || 0) + " pages";
  document.getElementById("rdm_rate").innerText         = rate;
  document.getElementById("rdm_revDate").innerText      = r[12] || "—";
  document.getElementById("rdm_deliveryDate").innerText = r[13] || "—";
  document.getElementById("rdm_notes").innerText        = (r[15] && r[15] !== "—" && r[15] !== "") ? r[15] : "No notes added for this revision.";

  var editBtn = document.getElementById("rdm_editBtn");
  if (editBtn) editBtn.onclick = function() { closeRevDetailModal(); editRevisionFull(r[0]); };

  document.getElementById("revDetailModal").style.display = "flex";
}
function closeRevDetailModal() {
  document.getElementById("revDetailModal").style.display = "none";
}
document.addEventListener("click", function(e) {
  var modal = document.getElementById("revDetailModal");
  if (modal && e.target === modal) closeRevDetailModal();
});

/* ── PROGRESS BAR ── */
function buildBar(label, val, max, colorClass, subLabel) {
  var pct = max > 0 ? Math.round((val / max) * 100) : 0;
  /* Right side: bold page count + optional muted sub-label on separate line */
  var rightHtml = '<div class="text-right leading-tight">' +
    '<span class="font-black text-slate-700 tabular-nums">' + Number(val).toLocaleString() + ' <span class="font-normal text-slate-400 text-[10px]">pg</span></span>' +
    (subLabel ? '<br><span class="text-[10px] text-slate-400">' + subLabel + '</span>' : '') +
    '</div>';
  return '<div>' +
    '<div class="flex items-start justify-between gap-2 mb-1.5">' +
      '<span class="text-xs font-semibold text-slate-600 leading-tight pt-0.5">' + label + '</span>' +
      rightHtml +
    '</div>' +
    '<div class="w-full bg-slate-100 rounded-full h-2.5 overflow-hidden">' +
      '<div class="' + colorClass + ' h-2.5 rounded-full transition-all duration-700" style="width:' + Math.max(pct,1) + '%"></div>' +
    '</div>' +
  '</div>';
}

/* ── POPULATE SELECT ── */
function populateSelect(id, items, valueProp, labelProp, placeholder) {
  var el = document.getElementById(id);
  if (!el) return;
  el.innerHTML = '<option value="">' + (placeholder || "— Select —") + '</option>' +
    items.map(function(i) { return '<option value="' + i[valueProp] + '">' + i[labelProp] + '</option>'; }).join("");
}
</script>
