<script>
/* ================================================================
   ScriptDashboard.html — Dashboard render logic
   ROW 1 = all-time totals (allTimeTotals)
   ROW 2 = selected-month volume by task type (summary)
================================================================ */
var _dashLoading = false;

/* ── Populate year dropdown and set current month/year as default ── */
function _dashInitFilter() {
  var now     = new Date();
  var yearEl  = document.getElementById("dash_filterYear");
  var monthEl = document.getElementById("dash_filterMonth");
  if (!yearEl || !monthEl) return;
  if (!yearEl.options.length) {
    for (var y = now.getFullYear(); y >= now.getFullYear() - 4; y--) {
      var opt = document.createElement("option");
      opt.value = y; opt.text = y;
      if (y === now.getFullYear()) opt.selected = true;
      yearEl.appendChild(opt);
    }
  }
  monthEl.value = now.getMonth() + 1;
}

function _dashGetFilter() {
  var monthEl = document.getElementById("dash_filterMonth");
  var yearEl  = document.getElementById("dash_filterYear");
  return {
    month: monthEl ? Number(monthEl.value) : new Date().getMonth() + 1,
    year:  yearEl  ? Number(yearEl.value)  : new Date().getFullYear()
  };
}

function _dashApplyFilter() {
  var f = _dashGetFilter();
  showLoader("Updating dashboard…");
  google.script.run
    .withFailureHandler(function(e){ hideLoader(); showToast("Dashboard error: " + e.message, "error"); })
    .withSuccessHandler(function(d){ hideLoader(); _renderDashboard(d || {}); })
    .getDashboardData(f);
}

function refreshDashboardStats() {
  if (_dashLoading) return;
  _dashLoading = true;
  _dashInitFilter();
  var f = _dashGetFilter();
  showLoader("Loading dashboard…");
  google.script.run
    .withFailureHandler(function(e){ _dashLoading = false; hideLoader(); showToast("Dashboard error: " + e.message, "error"); })
    .withSuccessHandler(function(d){ _dashLoading = false; hideLoader(); _renderDashboard(d || {}); })
    .getDashboardData(f);
}

function _renderDashboard(d) {
  var m  = d.summary       || {};
  var bt = m.byTaskType    || {};
  var at = d.allTimeTotals || {};

  /* ── header label ── */
  _set("dash_monthLabel", "Production metrics — " + (m.month || ""));
  _set("dash_monthName",  m.month || "Current Month");

  /* ROW 1 — ALL-TIME SUMMARY CARDS */
  _set("dash_totalProjects",    (at.totalProjects    || 0));
  _set("dash_activeProjects",   (at.activeProjects   || 0) + " active");
  _set("dash_completedProjects",(at.completedProjects|| 0) + " done");
  _set("dash_totalTasks",       (at.totalTasks       || 0));
  _set("dash_pendingTasks",     (at.pendingTasks     || 0) + " pending");
  _set("dash_inProgressTasks",  (at.inProgressTasks  || 0) + " in progress");
  _set("dash_totalRevisions",   (at.totalRevPages    || 0).toLocaleString());
  _set("dash_pendingRevisions", (at.pendingRevisions || 0) + " pending");
  _set("dash_totalRevPages",    (at.totalRevisions   || 0).toLocaleString() + " rounds");

  /* ROW 2 — THIS MONTH VOLUME */
  _set("dash_grandTotal", (m.grandTotal || 0).toLocaleString());
  _set("dash_monthIH",    (m.totalInHouse || 0).toLocaleString());
  _set("dash_monthVD",    (m.totalVendor  || 0).toLocaleString());

  var typeMax = Math.max(
    (bt.mainDTP  || {total:0}).total,
    (bt.preEng   || {total:0}).total,
    (bt.bilingual|| {total:0}).total,
    (bt.qc       || {total:0}).total,
    (bt.others   || {total:0}).total
  ) || 1;

  function _typeCard(key, totalId, ihId, vdId, barFillId) {
    var td = bt[key] || {total:0, inHouse:0, vendor:0};
    _set(totalId, td.total.toLocaleString());
    _set(ihId,    td.inHouse.toLocaleString());
    _set(vdId,    td.vendor.toLocaleString());
    var bar = document.getElementById(barFillId);
    if (bar) bar.style.width = Math.round(td.total / typeMax * 100) + "%";
  }
  _typeCard("mainDTP",   "dash_dtpTotal",    "dash_dtpIH",    "dash_dtpVD",    "dash_dtpBarFill");
  _typeCard("preEng",    "dash_preEngTotal", "dash_preEngIH", "dash_preEngVD", "dash_preEngBarFill");
  _typeCard("bilingual", "dash_bilingTotal", "dash_bilingIH", "dash_bilingVD", "dash_bilingBarFill");
  _typeCard("qc",        "dash_qcTotal",     "dash_qcIH",     "dash_qcVD",     "dash_qcBarFill");
  _typeCard("others",    "dash_othersTotal", "dash_othersIH", "dash_othersVD", "dash_othersBarFill");

  var revM = bt.revisions || {total:0, inHouse:0, vendor:0};
  _set("dash_revTotal", revM.total.toLocaleString());
  _set("dash_revIH",    revM.inHouse.toLocaleString());
  _set("dash_revVD",    revM.vendor.toLocaleString());

  /* Progress Tracker card */
  var activeProj    = at.activeProjects    || 0;
  var inProgProj    = at.inProgressProjects || 0;
  var inProgTasks   = at.inProgressTasks   || 0;
  var inProgPages   = at.inProgressPages   || 0;
  var totalTasks    = at.totalTasks        || 1;  /* avoid div/0 */

  _set("dash_activeProjectsTracker",   activeProj);
  _set("dash_activeProjectsPages",     (at.activeProjectPages   || 0).toLocaleString() + " pages");
  _set("dash_inProgressProjectsTracker", inProgProj);
  _set("dash_inProgressProjectsPages", (at.inProgressProjectPages || 0).toLocaleString() + " pages");
  _set("dash_inProgress",      inProgTasks);
  _set("dash_inProgressPages", (inProgPages || 0).toLocaleString());

  /* Animate progress bar proportional to in-progress tasks vs total */
  var bar = document.getElementById("dash_inProgressBar");
  if (bar) bar.style.width = Math.round(Math.min((inProgTasks / (at.totalTasks || 1)) * 100, 100)) + "%";
}


</script>
