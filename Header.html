<header class="sticky top-0 z-[1001] flex h-16 items-center justify-between border-b border-sky-100 bg-sky-50/80 px-6 backdrop-blur-md">
  
  <div class="flex items-center gap-4">
    <button onclick="toggleSidebar()" class="group relative flex h-10 w-10 items-center justify-center rounded-xl bg-white text-sky-600 shadow-sm transition-all hover:bg-sky-600 hover:text-white">
      <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path>
      </svg>
    </button>
    <div class="flex flex-col">
      <h1 class="text-lg font-black tracking-tight text-sky-900">DTP TRACKER</h1>
      <div class="flex items-center gap-2">
        <div class="h-2 w-2 animate-pulse rounded-full bg-green-500"></div>
        <span id="syncStatus" class="text-[10px] font-bold uppercase tracking-widest text-sky-600">System Live</span>
      </div>
    </div>
  </div>

  <div class="flex items-center gap-6">
    <div class="hidden flex-col items-end border-r border-sky-200 pr-6 sm:flex">
      <span class="text-[10px] font-bold uppercase text-sky-400">Database Sync</span>
      <span id="lastUpdated" class="font-mono text-xs font-medium text-sky-700">Just now</span>
    </div>

    <button id="refreshBtn" onclick="handleRefresh()" 
            class="flex items-center gap-2 rounded-xl bg-sky-600 px-5 py-2.5 text-sm font-bold text-white shadow-lg shadow-sky-200 transition-all hover:bg-sky-700 hover:shadow-sky-300 active:scale-95 disabled:opacity-50">
      <span id="refreshIcon">🔄</span>
      <span>Refresh Data</span>
    </button>
  </div>
</header>
