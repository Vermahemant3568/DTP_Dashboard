<header class="fixed top-0 left-0 right-0 z-[1001] h-16 flex items-center justify-between border-b border-sky-100 bg-white/90 px-6 backdrop-blur-md shadow-sm">

  <div class="flex items-center gap-4">
    <button onclick="toggleSidebar()"
      class="flex h-9 w-9 items-center justify-center rounded-xl bg-gray-100 text-gray-600 hover:bg-sky-600 hover:text-white transition-all">
      <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"/>
      </svg>
    </button>
    <div>
      <h1 class="text-base font-black tracking-tight text-slate-800">DTP TRACKER</h1>
      <div class="flex items-center gap-1.5">
        <div class="h-1.5 w-1.5 animate-pulse rounded-full bg-green-500"></div>
        <span class="text-[10px] font-bold uppercase tracking-widest text-slate-500">Live</span>
      </div>
    </div>
  </div>

  <div class="flex items-center gap-3">
    <!-- Quick nav: Revisions -->
    <button onclick="loadPage('revisions')"
      class="hidden md:flex items-center gap-1.5 rounded-xl border border-gray-200 bg-gray-50 px-3 py-2 text-xs font-semibold text-gray-600 hover:bg-gray-100 transition-all">
      <span>🔁</span><span>Revisions</span>
    </button>
    <!-- Quick nav: All Tasks -->
    <button onclick="loadPage('tasks')"
      class="hidden md:flex items-center gap-1.5 rounded-xl border border-gray-200 bg-gray-50 px-3 py-2 text-xs font-semibold text-gray-600 hover:bg-gray-100 transition-all">
      <span>📋</span><span>All Tasks</span>
    </button>

    <div class="hidden sm:flex flex-col items-end border-r border-gray-200 pr-3">
      <span class="text-[10px] font-bold uppercase text-gray-400">Last Sync</span>
      <span id="lastUpdated" class="font-mono text-xs font-medium text-gray-600">Just now</span>
    </div>

    <button id="refreshBtn" onclick="handleRefresh()"
      class="flex items-center gap-2 rounded-xl bg-gray-100 px-3 py-2 text-sm font-bold text-gray-600 hover:bg-gray-200 active:scale-95 transition-all disabled:opacity-50">
      <span id="refreshIcon">🔄</span>
      <span class="hidden sm:inline text-xs">Refresh</span>
    </button>

    <!-- PRIMARY CTA -->
    <button onclick="loadPage('addTask')"
      class="flex items-center gap-2 rounded-xl bg-sky-600 px-4 py-2 text-sm font-bold text-white shadow-md hover:bg-sky-700 active:scale-95 transition-all">
      <span>✅</span>
      <span class="hidden sm:inline">Add Task</span>
    </button>
  </div>

</header>
