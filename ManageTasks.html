<div class="space-y-5 page-enter">

  <!-- HEADER -->
  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
    <div>
      <h2 class="text-2xl font-bold text-slate-800">All Tasks</h2>
      <p class="text-sm text-slate-500 mt-0.5">Every DTP work entry — Main DTP, Pre-Engineering, Bilingual, QC, Others</p>
    </div>
    <button onclick="loadPage('addTask')"
      class="inline-flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold px-4 py-2.5 rounded-xl shadow-sm active:scale-95 transition-all">
      ✅ Add Task
    </button>
  </div>

  <!-- STATS -->
  <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
    <div class="stat-card border-l-4 border-l-blue-500">
      <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Total Tasks</p>
      <p id="task_stat_total" class="text-2xl font-bold text-slate-700 mt-1">—</p>
    </div>
    <div class="stat-card border-l-4 border-l-emerald-500">
      <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Total Pages</p>
      <p id="task_stat_pages" class="text-2xl font-bold text-emerald-600 mt-1">—</p>
    </div>
    <div class="stat-card border-l-4 border-l-amber-500">
      <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">In Progress</p>
      <p id="task_stat_inprog" class="text-2xl font-bold text-amber-500 mt-1">—</p>
    </div>
    <div class="stat-card border-l-4 border-l-green-500">
      <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Completed</p>
      <p id="task_stat_done" class="text-2xl font-bold text-green-500 mt-1">—</p>
    </div>
  </div>

  <!-- FILTERS -->
  <div class="section-card">
    <div class="flex flex-wrap gap-3 p-4">
      <div class="relative flex-1 min-w-[200px]">
        <span class="absolute inset-y-0 left-3 flex items-center text-gray-400">
          <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        </span>
        <input type="text" id="task_search" oninput="filterTasks()"
          placeholder="Search by project, client, language…"
          class="input pl-9">
      </div>
      <select id="task_statusFilter" onchange="filterTasks()" class="input w-36">
        <option value="">All Statuses</option>
        <option>Pending</option>
        <option>In Progress</option>
        <option>Completed</option>
        <option>On Hold</option>
      </select>
      <select id="task_typeFilter" onchange="filterTasks()" class="input w-44">
        <option value="">All Task Types</option>
        <option>Main DTP</option>
        <option>Pre-Engineering</option>
        <option>Bilingual Creation</option>
        <option>QC</option>
        <option>Others</option>
      </select>
      <select id="task_workFilter" onchange="filterTasks()" class="input w-36">
        <option value="">All Work Types</option>
        <option>In-House</option>
        <option>Vendor</option>
      </select>
    </div>
  </div>

  <!-- TABLE -->
  <div class="section-card overflow-hidden">
    <div class="overflow-x-auto">
      <table class="data-table">
        <thead>
          <tr>
            <th class="text-center">Task ID</th>
            <th class="text-center">Project / Client</th>
            <th class="text-center">Task Type</th>
            <th class="text-center">Language</th>
            <th class="text-center">Assigned / Vendor</th>
            <th class="text-center">Status</th>
            <th class="text-center">Src Pages</th>
            <th class="text-center">Final Pages</th>
            <th class="text-center">Delivery</th>
            <th class="text-center">Actions</th>
          </tr>
        </thead>
        <tbody id="tasksTable">
          <tr><td colspan="10" class="py-16 text-center text-slate-400 text-sm">Loading tasks…</td></tr>
        </tbody>
      </table>
    </div>
  </div>

</div>
