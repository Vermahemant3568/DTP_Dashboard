<script>
/* ================================================================
   ScriptProjects.html
================================================================ */
var ALL_PROJECTS    = [];
var _projFiltered   = [];   /* current filtered set */
var _projPage       = 1;
var _projPageSize   = 10;

function loadProjects() {
  showLoader("Loading projects...");
  google.script.run
    .withFailureHandler(function(e) { hideLoader(); showToast("Could not load projects: " + e.message, "error"); })
    .withSuccessHandler(function(data) {
      ALL_PROJECTS = data || [];
      _renderProjStats(ALL_PROJECTS);
      _populateCoordinatorFilter(ALL_PROJECTS);
      _projFiltered = ALL_PROJECTS;
      _projPage = 1;
      _renderProjectsPage();
      hideLoader();
    })
    .getProjectsWithTaskCount();
}

function _renderProjStats(data) {
  var total     = data.length;
  var active    = data.filter(function(r){ return r[9] === 'Active'; }).length;
  var pending   = data.filter(function(r){ return r[9] === 'Pending'; }).length;
  var completed = data.filter(function(r){ return r[9] === 'Completed'; }).length;
  var taskPg    = data.reduce(function(s,r){ return s + (Number(r[15])||0); }, 0);
  var revPg     = data.reduce(function(s,r){ return s + (Number(r[17])||0); }, 0);
  function _set(id, val) { var el = document.getElementById(id); if (el) el.textContent = val; }
  _set('pstat_total',     total);
  _set('pstat_active',    active);
  _set('pstat_pending',   pending);
  _set('pstat_completed', completed);
  _set('pstat_taskpages', taskPg.toLocaleString());
  _set('pstat_revpages',  revPg.toLocaleString());
}

/* Populate coordinator dropdown from unique coordinator names in loaded data */
function _populateCoordinatorFilter(data) {
  var sel = document.getElementById('proj_coordinatorFilter');
  if (!sel) return;
  var names = [];
  data.forEach(function(r) {
    var n = (r[3] || '').trim();
    if (n && names.indexOf(n) === -1) names.push(n);
  });
  names.sort();
  var current = sel.value;
  sel.innerHTML = '<option value="">All Coordinators</option>' +
    names.map(function(n) {
      return '<option value="' + n + '"' + (n === current ? ' selected' : '') + '>' + n + '</option>';
    }).join('');
}

/* Render only the current page slice */
function _renderProjectsPage() {
  var total     = _projFiltered.length;
  var totalPages = Math.max(1, Math.ceil(total / _projPageSize));
  if (_projPage > totalPages) _projPage = totalPages;
  var start  = (_projPage - 1) * _projPageSize;
  var end    = Math.min(start + _projPageSize, total);
  var slice  = _projFiltered.slice(start, end);

  _renderProjectsTable(slice, total, start, end);
  _renderProjPagination(totalPages, total, start, end);
}

function _renderProjPagination(totalPages, total, start, end) {
  var infoEl    = document.getElementById('proj_pageInfo');
  var prevBtn   = document.getElementById('proj_prevBtn');
  var nextBtn   = document.getElementById('proj_nextBtn');
  var numsEl    = document.getElementById('proj_pageNumbers');
  var paginEl   = document.getElementById('proj_pagination');

  if (infoEl) infoEl.textContent = total === 0
    ? 'No projects found'
    : 'Showing ' + (start + 1) + '\u2013' + end + ' of ' + total + ' project' + (total !== 1 ? 's' : '');

  if (prevBtn) prevBtn.disabled = _projPage <= 1;
  if (nextBtn) nextBtn.disabled = _projPage >= totalPages;

  /* Page number buttons — show max 5 around current page */
  if (numsEl) {
    var pages = [];
    var range = 2;
    for (var i = Math.max(1, _projPage - range); i <= Math.min(totalPages, _projPage + range); i++) {
      pages.push(i);
    }
    numsEl.innerHTML = pages.map(function(p) {
      var active = p === _projPage
        ? 'bg-sky-600 text-white font-bold shadow-sm'
        : 'bg-gray-100 text-gray-500 hover:bg-gray-200';
      return '<button onclick="_projGoToPage(' + p + ')" class="h-7 w-7 flex items-center justify-center text-xs rounded-lg transition-all ' + active + '">' + p + '</button>';
    }).join('');
  }

  /* Hide pagination bar entirely when only 1 page */
  if (paginEl) paginEl.style.display = totalPages <= 1 && total <= _projPageSize ? 'none' : 'flex';
}

function _projChangePage(delta) {
  var total      = _projFiltered.length;
  var totalPages = Math.max(1, Math.ceil(total / _projPageSize));
  _projPage = Math.max(1, Math.min(_projPage + delta, totalPages));
  _renderProjectsPage();
}

function _projGoToPage(p) {
  _projPage = p;
  _renderProjectsPage();
}

function _fmtLangs(src, targets) {
  var srcStr = (src || "").trim();
  var parts  = (targets || "").split(",").map(function(s){ return s.trim(); }).filter(Boolean);
  var shown  = parts.slice(0, 2).join(", ");
  var more   = parts.length > 2 ? ' <span class="text-gray-400">+' + (parts.length - 2) + ' more</span>' : "";
  var arrow  = srcStr && parts.length ? ' <span class="text-gray-300">→</span> ' : "";
  return (srcStr || "—") + arrow + (shown || (srcStr ? "" : "—")) + more;
}

function _renderProjectsTable(data, total, start, end) {
  var tbody = document.getElementById("projectsTable");
  var label = document.getElementById("proj_countLabel");
  if (!tbody) return;
  var shown = (total !== undefined) ? total : data.length;
  if (label) label.textContent = shown + ' project' + (shown !== 1 ? 's' : '') + ' total';
  if (!data.length) {
    tbody.innerHTML = '<tr><td colspan="13" class="py-16 text-center text-slate-400 text-sm">No projects found.</td></tr>';
    return;
  }
  tbody.innerHTML = data.map(function(r) {
    var sc = getStatusClass(r[9] || "Active");
    var pc = r[8] === "Urgent" ? "bg-red-100 text-red-700" :
             r[8] === "High"   ? "bg-orange-100 text-orange-700" :
             r[8] === "Low"    ? "bg-gray-100 text-gray-500" : "bg-blue-100 text-blue-700";
    var taskCount = Number(r[14]) || 0;
    var taskPages = Number(r[15]) || 0;
    var srcPages  = Number(r[7])  || 0;
    var revCount  = Number(r[16]) || 0;
    var revPages  = Number(r[17]) || 0;
    var totPages  = Number(r[18]) || 0;
    var revBadge  = revCount > 0
      ? '<span class="inline-flex items-center bg-amber-100 text-amber-700 text-xs font-semibold px-2 py-0.5 rounded-full">R' + revCount + '</span>'
      : '<span class="text-gray-300 text-xs">\u2014</span>';
    return '<tr data-id="' + r[0] + '">' +
      '<td class="font-mono text-[11px] text-gray-400">' + r[0] + '</td>' +
      '<td><div class="font-semibold text-gray-900 text-sm">' + (r[1] || '\u2014') + '</div>' +
          '<div class="text-xs text-gray-500">' + (r[2] || '\u2014') + '</div></td>' +
      /* Languages column hidden — not needed currently */
      /* '<td class="text-xs text-gray-600">' + _fmtLangs(r[4], r[5]) + '<div class="text-gray-400">' + (r[6] || 0) + ' langs</div></td>' + */
      '<td class="text-center text-sm text-gray-600">' + (srcPages || '\u2014') + '</td>' +
      '<td class="text-sm text-gray-600">' + (r[3] || '\u2014') + '</td>' +
      '<td><span class="badge ' + pc + '">' + (r[8] || 'Medium') + '</span></td>' +
      '<td><span class="badge ' + sc + '">' + (r[9] || 'Active') + '</span></td>' +
      '<td class="text-center text-sm font-semibold text-blue-600">' + taskCount + '</td>' +
      '<td class="text-center text-sm font-semibold text-emerald-600">' + taskPages.toLocaleString() + '</td>' +
      '<td class="text-center">' + revBadge + '</td>' +
      '<td class="text-center text-sm font-semibold text-amber-600">' + (revPages ? revPages.toLocaleString() : '\u2014') + '</td>' +
      '<td class="text-center text-sm font-bold text-slate-700">' + (totPages ? totPages.toLocaleString() : '\u2014') + '</td>' +
      '<td class="text-xs text-gray-500">' + (r[10] || '\u2014') + '</td>' +
      '<td class="text-right">' +
        '<div class="flex justify-end gap-1">' +
          btnView(r[0], "viewProjectById") +
          btnStatus(r[0], "openProjectQuickEdit") +
          btnDelete(r[0], "deleteProjectById") +
        '</div>' +
      '</td>' +
    '</tr>';
  }).join("");
}

function _resetProjFilters() {
  var s  = document.getElementById('proj_search');             if (s)  s.value  = '';
  var st = document.getElementById('proj_statusFilter');       if (st) st.value = '';
  var co = document.getElementById('proj_coordinatorFilter');  if (co) co.value = '';
  _projFiltered = ALL_PROJECTS;
  _projPage = 1;
  _renderProjectsPage();
}

function filterProjects() {
  var q  = (_val("proj_search")             || "").toLowerCase();
  var st = _val("proj_statusFilter")        || "";
  var co = _val("proj_coordinatorFilter")   || "";
  _projFiltered = ALL_PROJECTS.filter(function(r) {
    var mq = !q  || [r[0],r[1],r[2]].some(function(v){ return String(v).toLowerCase().includes(q); });
    var ms = !st || r[9] === st;
    var mc = !co || (r[3] || '').trim() === co;
    return mq && ms && mc;
  });
  _projPage = 1;
  _renderProjectsPage();
}

function viewProjectById(id) {
  showLoader("Loading project...");
  google.script.run
    .withFailureHandler(function(e) { hideLoader(); showToast("Could not load: " + e.message, "error"); })
    .withSuccessHandler(function(data) {
      if (!data) { hideLoader(); showToast("Project not found.", "error"); return; }
      loadPage("viewProject", data);
    })
    .getProjectSummary(id);
}

function openProjectQuickEdit(id) {
  var proj = ALL_PROJECTS.find(function(r){ return r[0] === id; });
  if (!proj) { showToast("Project not found.", "error"); return; }
  document.getElementById("m_itemId").innerText   = id;
  document.getElementById("m_itemName").innerText = proj[2] || "—";
  document.getElementById("m_status").value       = proj[9] || "Active";
  document.getElementById("m_deliveryDate").value = "";
  document.getElementById("editModal").dataset.editType = "project";
  document.getElementById("editModal").style.display    = "flex";
}

function deleteProjectById(id) {
  customConfirm("Permanently delete project " + id + "? This cannot be undone.", function() {
    showLoader("Deleting...");
    google.script.run
      .withFailureHandler(function(e){ hideLoader(); showToast("Delete failed: " + e.message, "error"); })
      .withSuccessHandler(function(){ hideLoader(); showToast("Project deleted.", "warning"); loadProjects(); })
      .deleteProject(id);
  }, true);
}

/* ── snapshot of original values when project edit form loads ── */
var _projOriginal = {};

/* ── PROJECT FORM SUBMIT ── */
(function() {
  var _projSubmitting = false;
  document.addEventListener("submit", function(e) {
    if (!e.target || e.target.id !== "projectForm") return;
    e.preventDefault();
    if (_projSubmitting) return;

    var editId = document.getElementById("contentArea").dataset.editProjectId || "";
    var current = {
      clientName:      _val("proj_clientName"),
      projectName:     _val("proj_projectName"),
      coordinator:     _val("proj_coordinator"),
      priority:        _val("proj_priority"),
      status:          _val("proj_status"),
      receivedDate:    _val("proj_receivedDate"),
      sourceLanguage:  _val("proj_sourceLanguage"),
      targetLanguages: _val("proj_targetLanguages"),
      langCount:       _val("proj_langCount"),
      sourcePages:     _val("proj_sourcePages"),
      notes:           _val("proj_notes")
    };
    if (!current.clientName || !current.projectName) { showToast("Client Name and Project Name are required.", "error"); return; }

    var btn   = document.getElementById("projSubmitBtn");
    var lblEl = document.getElementById("projSubmitLabel");

    if (editId) {
      /* Build diff — only send changed fields */
      var diff = {};
      Object.keys(current).forEach(function(k) {
        if (String(current[k]) !== String(_projOriginal[k] !== undefined ? _projOriginal[k] : "")) {
          diff[k] = current[k];
        }
      });
      if (!Object.keys(diff).length) { showToast("No changes detected.", "info"); return; }
      _projSubmitting = true;
      btn.disabled = true;
      if (lblEl) lblEl.innerText = "Saving...";
      showLoader("Updating project...");
      google.script.run
        .withFailureHandler(function(er){ _projSubmitting=false; hideLoader(); btn.disabled=false; if(lblEl) lblEl.innerText="Update Project"; showToast("Error: "+er.message,"error"); })
        .withSuccessHandler(function(res){
          _projSubmitting=false;
          hideLoader();
          showToast("Project updated!","success");
          /* Patch in-memory cache and re-render only the changed row */
          if (res && res.updated) {
            var idx = ALL_PROJECTS.findIndex(function(r){ return r[0]===editId; });
            if (idx !== -1) {
              var saved = ALL_PROJECTS[idx].slice(14, 19);
              ALL_PROJECTS[idx] = res.updated;
              for (var i = 0; i < saved.length; i++) ALL_PROJECTS[idx][14 + i] = saved[i];
              /* Re-apply current filter so the patched row is reflected */
              filterProjects();
            }
          }
          loadPage("projects");
        })
        .updateProject(editId, diff);
      return;
    }

    /* ── NEW PROJECT ── */
    _projSubmitting = true;
    btn.disabled = true;
    if (lblEl) lblEl.innerText = "Saving...";
    showLoader("Creating project...");
    google.script.run
      .withFailureHandler(function(er){ _projSubmitting=false; hideLoader(); btn.disabled=false; if(lblEl) lblEl.innerText="Register Project"; showToast("Error: "+er.message,"error"); })
      .withSuccessHandler(function(res){
        _projSubmitting=false;
        hideLoader();
        var form       = document.getElementById("projectForm");
        var panel      = document.getElementById("proj_successPanel");
        var nameEl     = document.getElementById("proj_successName");
        var idEl       = document.getElementById("proj_successId");
        var addTaskBtn = document.getElementById("proj_addTaskBtn");
        if (form)  form.style.display  = "none";
        if (panel) panel.style.display = "block";
        if (nameEl) nameEl.innerText = current.projectName + " — " + current.clientName;
        if (idEl)   idEl.innerText   = "Project ID: " + (res.id || "");
        if (addTaskBtn) addTaskBtn.onclick = function() { loadPage("addTask", { projectId: res.id }); };
      })
      .addProject(current);
  });
})();

function _resetProjectForm() {
  var form  = document.getElementById("projectForm");
  var panel = document.getElementById("proj_successPanel");
  if (form)  { form.style.display = ""; form.reset(); }
  if (panel) panel.style.display = "none";
  var btn   = document.getElementById("projSubmitBtn");
  var lblEl = document.getElementById("projSubmitLabel");
  if (btn)   btn.disabled = false;
  if (lblEl) lblEl.innerText = "Register Project";
}

/* Patch a single row in the projects table without full re-render */
function _patchProjectRow(id, r) {
  var row = document.querySelector('#projectsTable tr[data-id="' + id + '"]');
  if (!row) return;
  var sc = getStatusClass(r[9] || 'Active');
  var pc = r[8] === 'Urgent' ? 'bg-red-100 text-red-700' :
           r[8] === 'High'   ? 'bg-orange-100 text-orange-700' :
           r[8] === 'Low'    ? 'bg-gray-100 text-gray-500' : 'bg-blue-100 text-blue-700';
  var cells = row.cells;
  if (!cells || cells.length < 13) return;
  /* Languages column hidden — not needed currently (was cells[2]) */
  /* Shift all cell indices down by 1 */
  cells[1].innerHTML   = '<div class="font-semibold text-gray-900 text-sm">' + (r[1]||'\u2014') + '</div><div class="text-xs text-gray-500">' + (r[2]||'\u2014') + '</div>';
  cells[2].textContent = Number(r[7]) || '\u2014';
  cells[3].textContent = r[3] || '\u2014';
  cells[4].innerHTML   = '<span class="badge ' + pc + '">' + (r[8]||'Medium') + '</span>';
  cells[5].innerHTML   = '<span class="badge ' + sc + '">' + (r[9]||'Active') + '</span>';
  cells[6].textContent = Number(r[14]) || 0;
  cells[7].textContent = (Number(r[15]) || 0).toLocaleString();
  var revCount = Number(r[16]) || 0;
  cells[8].innerHTML   = revCount > 0
    ? '<span class="inline-flex items-center bg-amber-100 text-amber-700 text-xs font-semibold px-2 py-0.5 rounded-full">R' + revCount + '</span>'
    : '<span class="text-gray-300 text-xs">\u2014</span>';
  cells[9].textContent  = Number(r[17]) ? Number(r[17]).toLocaleString() : '\u2014';
  cells[10].textContent = Number(r[18]) ? Number(r[18]).toLocaleString() : '\u2014';
  cells[11].textContent = r[10] || '\u2014';
}

/* ================================================================
   ADD PROJECT — duplicate check & inline live check
================================================================ */
var _projDupTimer    = null;
var _projDupMatches  = [];
var _projInlineDupId = "";

function _projDupSearchDebounce() {
  if (_projDupTimer) clearTimeout(_projDupTimer);
  _projDupTimer = setTimeout(_projDupSearch, 350);
}

function _projDupSearch() {
  var q      = ((document.getElementById("proj_dupCheck") || {}).value || "").trim();
  var resEl  = document.getElementById("proj_dupResults");
  var noneEl = document.getElementById("proj_dupNone");
  if (!resEl || !noneEl) { showToast("Search panel not found. Make sure you are on the Register Project page.", "error"); return; }
  resEl.style.display  = "none";
  noneEl.style.display = "none";
  _projDupMatches      = [];
  if (!q || q.length < 2) { showToast("Enter at least 2 characters to search.", "warning"); return; }

  showLoader("Searching projects...");

  google.script.run
    .withFailureHandler(function(e) {
      hideLoader();
      showToast("Search failed: " + (e.message || e), "error");
    })
    .withSuccessHandler(function(results) {
      hideLoader();
      _projDupMatches = results || [];
      if (!_projDupMatches.length) {
        noneEl.style.display = "block";
        return;
      }
      resEl.innerHTML = _projDupMatches.map(function(p, i) {
        return '<div class="flex items-center justify-between gap-3 px-4 py-3 hover:bg-amber-50 transition-colors">' +
          '<div>' +
            '<p class="text-sm font-semibold text-gray-800">' + (p[2] || "\u2014") + '</p>' +
            '<p class="text-xs text-gray-500 mt-0.5">' + (p[1] || "\u2014") +
              ' \u00b7 <span class="font-mono">' + p[0] + '</span>' +
              (p[9] ? ' \u00b7 <span class="text-amber-600">' + p[9] + '</span>' : '') +
            '</p>' +
          '</div>' +
          '<button type="button" onclick="_proj_useMatch(' + i + ')"' +
            ' class="shrink-0 text-xs font-bold text-white bg-sky-600 hover:bg-sky-700 px-3 py-1.5 rounded-lg transition-colors">' +
            'Use This \u2192' +
          '</button>' +
        '</div>';
      }).join("");
      resEl.style.display = "block";
    })
    .searchProjects(q);
}

function _proj_useMatch(idx) {
  var p = _projDupMatches[idx];
  if (!p) return;
  loadPage("addTask", { projectId: p[0] });
}

/* Live inline duplicate check as user types client + project name */
var _projLiveTimer = null;
function _proj_liveClientCheck() {
  if (_projLiveTimer) clearTimeout(_projLiveTimer);
  _projLiveTimer = setTimeout(function() {
    var client  = ((document.getElementById("proj_clientName")  || {}).value || "").trim();
    var project = ((document.getElementById("proj_projectName") || {}).value || "").trim();
    var warnEl  = document.getElementById("proj_inlineDupWarn");
    var msgEl   = document.getElementById("proj_inlineDupMsg");
    if (!warnEl || !msgEl) return;
    if (!client || project.length < 3) { warnEl.style.display = "none"; return; }
    google.script.run
      .withFailureHandler(function() {})
      .withSuccessHandler(function(results) {
        var match = (results || []).find(function(p) {
          return String(p[1] || "").toLowerCase().includes(client.toLowerCase()) &&
                 String(p[2] || "").toLowerCase().includes(project.toLowerCase().substring(0, 5));
        });
        if (match) {
          _projInlineDupId     = match[0];
          msgEl.innerText      = 'Found: "' + (match[2] || "—") + '" for ' + (match[1] || "—") + ' (' + match[0] + ')';
          warnEl.style.display = "block";
        } else {
          _projInlineDupId     = "";
          warnEl.style.display = "none";
        }
      })
      .searchProjects(client);
  }, 500);
}

function _proj_goToExistingFromInline() {
  loadPage("addTask", _projInlineDupId ? { projectId: _projInlineDupId } : {});
}
</script>
