<script>
/* ================================================================
   ScriptRevisions.html
================================================================ */
var ALL_REVISIONS   = [];
var _revFiltered    = [];   /* current filtered set */
var _revPage        = 1;
var _revPageSize    = 10;

function loadRevisions() {
  showLoader("Loading revisions...");
  google.script.run
    .withFailureHandler(function(e){ hideLoader(); showToast("Could not load revisions: "+e.message,"error"); })
    .withSuccessHandler(function(data){
      ALL_REVISIONS = data||[];
      _renderRevStats(ALL_REVISIONS);
      _revFiltered = ALL_REVISIONS;
      _revPage = 1;
      _renderRevisionsPage();
      hideLoader();
    })
    .getRevisions();
}

function _renderRevStats(data) {
  var pages  = data.reduce(function(s,r){ return s+(Number(r[7])||0); },0);
  var pending= data.filter(function(r){ return r[11]==="Pending"; }).length;
  var done   = data.filter(function(r){ return r[11]==="Completed"; }).length;
  _set("rev_stat_total",  data.length);
  _set("rev_stat_pages",  pages.toLocaleString());
  _set("rev_stat_pending",pending);
  _set("rev_stat_done",   done);
}

/* Render only the current page slice */
function _renderRevisionsPage() {
  var total      = _revFiltered.length;
  var totalPages = Math.max(1, Math.ceil(total / _revPageSize));
  if (_revPage > totalPages) _revPage = totalPages;
  var start = (_revPage - 1) * _revPageSize;
  var end   = Math.min(start + _revPageSize, total);
  _renderRevisionsTable(_revFiltered.slice(start, end), total, start, end);
  _renderRevPagination(totalPages, total, start, end);
}

function _renderRevPagination(totalPages, total, start, end) {
  var infoEl  = document.getElementById('rev_pageInfo');
  var prevBtn = document.getElementById('rev_prevBtn');
  var nextBtn = document.getElementById('rev_nextBtn');
  var numsEl  = document.getElementById('rev_pageNumbers');
  var pagEl   = document.getElementById('rev_pagination');

  if (infoEl) infoEl.textContent = total === 0
    ? 'No revisions found'
    : 'Showing ' + (start + 1) + '\u2013' + end + ' of ' + total + ' revision' + (total !== 1 ? 's' : '');

  if (prevBtn) prevBtn.disabled = _revPage <= 1;
  if (nextBtn) nextBtn.disabled = _revPage >= totalPages;

  if (numsEl) {
    var pages = [];
    for (var i = Math.max(1, _revPage - 2); i <= Math.min(totalPages, _revPage + 2); i++) pages.push(i);
    numsEl.innerHTML = pages.map(function(p) {
      var cls = p === _revPage
        ? 'bg-purple-600 text-white font-bold shadow-sm'
        : 'bg-gray-100 text-gray-500 hover:bg-gray-200';
      return '<button onclick="_revGoToPage(' + p + ')" class="h-7 w-7 flex items-center justify-center text-xs rounded-lg transition-all ' + cls + '">' + p + '</button>';
    }).join('');
  }

  if (pagEl) pagEl.style.display = totalPages <= 1 && total <= _revPageSize ? 'none' : 'flex';
}

function _revChangePage(delta) {
  var totalPages = Math.max(1, Math.ceil(_revFiltered.length / _revPageSize));
  _revPage = Math.max(1, Math.min(_revPage + delta, totalPages));
  _renderRevisionsPage();
}

function _revGoToPage(p) {
  _revPage = p;
  _renderRevisionsPage();
}

function _renderRevisionsTable(data, total, start, end) {
  var tbody = document.getElementById("revisionsTable");
  var label = document.getElementById("rev_countLabel");
  if (!tbody) return;
  var shown = (total !== undefined) ? total : data.length;
  if (label) label.textContent = shown + ' revision' + (shown !== 1 ? 's' : '') + ' total';
  if (!data.length) {
    tbody.innerHTML = '<tr><td colspan="14" class="py-16 text-center text-slate-400 text-sm">No revisions found.</td></tr>';
    return;
  }
  tbody.innerHTML = data.map(function(r) {
    var sc  = getStatusClass(r[11]||"Pending");
    var wc  = getWorkClass(r[8]||"In-House");
    var who = r[8]==="Vendor" ? (r[10]||r[9]||"—") : (r[9]||"—");
    var taskCell = r[2]
      ? '<span class="font-mono text-[10px] text-blue-600 bg-blue-50 px-1.5 py-0.5 rounded">' + r[2] + '</span>'
      : '<span class="text-slate-300 text-xs">—</span>';
    var noteCell = r[15]
      ? '<button onclick="openRevDetailModal(ALL_REVISIONS.find(function(x){return x[0]===\'' + r[0] + '\';}))" class="group flex items-start gap-1.5 text-left w-full hover:opacity-80 transition-opacity" title="Click to view full notes">'
          + '<span class="mt-0.5 text-purple-400 shrink-0 text-xs">📝</span>'
          + '<span class="text-xs text-gray-600 line-clamp-2 leading-relaxed group-hover:text-purple-700 transition-colors">' + r[15] + '</span>'
        + '</button>'
      : '<span class="text-gray-300 text-xs">—</span>';
    return '<tr data-id="' + r[0] + '">' +
      '<td class="text-center font-mono text-[11px] text-gray-400">' + r[0] + '</td>' +
      '<td class="text-center"><div class="font-semibold text-gray-900 text-sm">' + (r[3]||r[1]||"\u2014") + '</div>' +
          '<div class="font-mono text-[10px] text-gray-400">' + r[1] + '</div></td>' +
      '<td class="text-center">' + taskCell + '</td>' +
      '<td class="text-center"><div class="text-sm font-semibold text-gray-700">' + (r[4]||"\u2014") + '</div>' +
          '<div class="text-xs text-gray-400">' + (r[5]||"\u2014") + '</div></td>' +
      '<td class="text-center"><span class="badge bg-purple-100 text-purple-700">' + (r[6]||"\u2014") + '</span></td>' +
      '<td class="text-center text-sm text-gray-600">' + who + '</td>' +
      '<td class="text-center"><span class="badge ' + wc + '">' + (r[8]||"In-House") + '</span></td>' +
      '<td class="text-center"><span class="badge ' + sc + '">' + (r[11]||"Pending") + '</span></td>' +
      '<td class="text-center font-bold text-purple-600 text-sm">' + (Number(r[7])||0) + '</td>' +
      '<td class="text-center">' + (r[20] === "Paid"
        ? '<span class="badge bg-green-100 text-green-700">Paid</span>'
        : '<span class="badge bg-red-50 text-red-500">Unpaid</span>') + '</td>' +
      '<td class="text-center text-sm font-semibold text-emerald-700">' + (Number(r[18]) > 0 ? Number(r[18]).toLocaleString() : '\u2014') + '</td>' +
      '<td class="text-center text-xs text-gray-500">' + (r[12]||"\u2014") + '</td>' +
      '<td class="max-w-[160px]">' + noteCell + '</td>' +
      '<td class="text-center">' +
        '<div class="flex justify-center gap-1">' +
          '<button onclick="openRevDetailModal(ALL_REVISIONS.find(function(x){return x[0]===\'' + r[0] + '\';}))" title="View Details" class="px-2 py-1 text-xs font-semibold text-purple-600 hover:bg-purple-50 rounded-lg transition-all">View</button>' +
          btnStatus(r[0], "openRevisionQuickEdit") +
          btnEdit(r[0],   "editRevisionFull") +
          btnDelete(r[0], "deleteRevisionById") +
        '</div>' +
      '</td>' +
    '</tr>';
  }).join("");
}

function filterRevisions() {
  var q  = (_val("rev_search")||"").toLowerCase();
  var st = _val("rev_statusFilter")||"";
  var rt = _val("rev_typeFilter")||"";
  var wt = _val("rev_workFilter")||"";
  _revFiltered = ALL_REVISIONS.filter(function(r){
    var mq = !q  || [r[0],r[1],r[2],r[3],r[6]].some(function(v){ return String(v).toLowerCase().includes(q); });
    var ms = !st || r[11]===st;
    var mr = !rt || r[5]===rt;
    var mw = !wt || r[8]===wt;
    return mq&&ms&&mr&&mw;
  });
  _revPage = 1;
  _renderRevisionsPage();
}

function _resetRevFilters() {
  var s  = document.getElementById('rev_search');       if (s)  s.value  = '';
  var st = document.getElementById('rev_statusFilter'); if (st) st.value = '';
  var rt = document.getElementById('rev_typeFilter');   if (rt) rt.value = '';
  var wt = document.getElementById('rev_workFilter');   if (wt) wt.value = '';
  _revFiltered = ALL_REVISIONS;
  _revPage = 1;
  _renderRevisionsPage();
}

function openRevisionQuickEdit(id) {
  var rev = ALL_REVISIONS.find(function(r){ return r[0]===id; });
  if (!rev) { showToast("Revision not found.","error"); return; }
  document.getElementById("m_itemId").innerText   = id;
  document.getElementById("m_itemName").innerText = (rev[3]||rev[1]||"—") + " · " + (rev[6]||"");
  document.getElementById("m_status").value       = rev[11]||"Pending";
  document.getElementById("m_deliveryDate").value = formatForInput(rev[13]);
  document.getElementById("editModal").dataset.editType = "revision";
  document.getElementById("editModal").style.display    = "flex";
}

function editRevisionFull(id) { loadPage("addRevision", { editId: id }); }

/* ================================================================
   LOAD FOR EDIT — called from _initAddRevisionForm when editId present
================================================================ */
/* ── snapshot of original values when edit form loads ── */
var _revOriginal = {};

function loadRevisionForEdit(id) {
  showLoader("Loading revision...");
  google.script.run
    .withFailureHandler(function(e){ hideLoader(); showToast("Could not load revision: "+e.message,"error"); })
    .withSuccessHandler(function(res){
      hideLoader();
      if (!res||!res.revision) { showToast("Revision not found.","error"); return; }
      var r = res.revision;
      var titleEl = document.getElementById("addRevTitle");
      var lblEl   = document.getElementById("revSubmitLabel");
      if (titleEl) titleEl.innerText = "Edit Revision";
      if (lblEl)   lblEl.innerText   = "Update Revision";

      /* Show project as linked */
      _setVal("rev_projectId", r[1]);
      _revProjectLinked = true;
      _revTaskLinked    = true;
      _revLinkedTaskId  = r[2] || "";
      var prev = document.getElementById("rev_projectPreview");
      var notF = document.getElementById("rev_projectNotFound");
      if (prev) prev.style.display = "block";
      if (notF) notF.style.display = "none";
      _set("rev_preview_name",   r[3] || "—");
      _set("rev_preview_client", "Project ID: " + (r[1] || "—"));
      _set("rev_preview_langs",  "Language: " + (r[6] || "—"));

      /* Show task step and detail step */
      _showRevStep("rev_taskStep");
      _showRevStep("rev_detailStep");
      _showRevStep("rev_submitBar");

      /* Show task preview if task was linked */
      if (r[2]) {
        var tp = document.getElementById("rev_taskPreview");
        if (tp) {
          tp.style.display = "block";
          _set("rev_tp_id",     r[2]);
          _set("rev_tp_lang",   r[6]||"—");
          _set("rev_tp_wt",     r[8]||"—");
          _set("rev_tp_who",    r[8]==="Vendor" ? (r[10]||"—") : (r[9]||"—"));
          _set("rev_tp_rate",   r[18] ? (r[19]||"")+" "+Number(r[18]).toLocaleString() : "—");
          _set("rev_tp_type",   "—");
          _set("rev_tp_pages",  "—");
          _set("rev_tp_status", "—");
        }
        var tl = document.getElementById("rev_taskList");
        if (tl) tl.style.display = "none";
        var tld = document.getElementById("rev_taskLoading");
        if (tld) tld.style.display = "none";
      }

      /* Fill all form fields */
      _setVal("rev_revisionNumber", r[4]);
      _setVal("rev_revisionType",   r[5]);
      _setVal("rev_language",       r[6]);
      _setVal("rev_pages",          r[7]);
      _setVal("rev_status",         r[11]);
      _setVal("rev_revisionDate",   formatForInput(r[12]));
      _setVal("rev_deliveryDate",   formatForInput(r[13]));
      _setVal("rev_notes",          r[15]);
      _setVal("rev_ratePerPage",   r[18]);
      _setVal("rev_paymentStatus",  r[20] || "Unpaid");

      var wt = r[8] || "In-House";
      var radio = document.querySelector('input[name="rev_workType"][value="'+wt+'"]');
      if (radio) { radio.checked = true; _updateWorkTypeBtns("rev_workType","rev_wt_inhouse_btn","rev_wt_vendor_btn"); }
      _syncRevAssignmentFields();
      if (typeof _onRevPaymentStatusChange === "function") _onRevPaymentStatusChange();
      /* Set assignedTo / vendorName by matching option value, not _setVal */
      if (wt === "In-House") {
        var aEl = document.getElementById("rev_assignedTo");
        if (aEl && r[9]) {
          for (var i = 0; i < aEl.options.length; i++) {
            if (aEl.options[i].value === String(r[9])) { aEl.selectedIndex = i; break; }
          }
        }
      } else {
        var vEl = document.getElementById("rev_vendorName");
        if (vEl && r[10]) {
          for (var j = 0; j < vEl.options.length; j++) {
            if (vEl.options[j].value === String(r[10])) { vEl.selectedIndex = j; break; }
          }
        }
      }
      _updateRevEstimate();
      /* Snapshot original values for diff on submit */
      var wtEl2 = document.querySelector('input[name="rev_workType"]:checked');
      _revOriginal = {
        revisionNumber: r[4]||"", revisionType: r[5]||"Client Feedback",
        language: r[6]||"", revisionPages: String(r[7]||""),
        workType: r[8]||"In-House", assignedTo: r[9]||"", vendorName: r[10]||"",
        status: r[11]||"Pending", revisionDate: formatForInput(r[12]),
        deliveryDate: formatForInput(r[13]), notes: r[15]||"",
        ratePerPage: String(r[18]||""),
        paymentStatus: r[20]||"Unpaid"
      };
    })
    .getRevisionById(id);
}

function deleteRevisionById(id) {
  customConfirm("Delete revision "+id+"? This cannot be undone.", function(){
    showLoader("Deleting...");
    google.script.run
      .withFailureHandler(function(e){ hideLoader(); showToast("Delete failed: "+e.message,"error"); })
      .withSuccessHandler(function(){ hideLoader(); showToast("Revision deleted.","warning"); loadRevisions(); })
      .deleteRevision(id);
  }, true);
}

/* Patch a single row in the revisions table without full re-render */
function _patchRevisionRow(id, r) {
  var row = document.querySelector('#revisionsTable tr[data-id="' + id + '"]');
  if (!row) return;
  var sc  = getStatusClass(r[11]||"Pending");
  var wc  = getWorkClass(r[8]||"In-House");
  var who = r[8]==="Vendor" ? (r[10]||r[9]||"—") : (r[9]||"—");
  var cells = row.cells;
  if (!cells || cells.length < 10) return;
  cells[3].innerHTML = '<div class="text-sm font-semibold text-gray-700">' + (r[4]||"—") + '</div><div class="text-xs text-gray-400">' + (r[5]||"—") + '</div>';
  cells[4].innerHTML = '<span class="badge bg-purple-100 text-purple-700">' + (r[6]||"—") + '</span>';
  cells[5].textContent = who;
  cells[6].innerHTML = '<span class="badge ' + wc + '">' + (r[8]||"In-House") + '</span>';
  cells[7].innerHTML = '<span class="badge ' + sc + '">' + (r[11]||"Pending") + '</span>';
  cells[8].textContent = Number(r[7]) || 0;
  cells[9].innerHTML   = r[20] === "Paid"
    ? '<span class="badge bg-green-100 text-green-700">Paid</span>'
    : '<span class="badge bg-red-50 text-red-500">Unpaid</span>';
  cells[10].textContent = Number(r[18]) > 0 ? Number(r[18]).toLocaleString() : '—';
  cells[11].textContent = r[12] || "—";
  var noteCell = r[15]
    ? '<button onclick="openRevDetailModal(ALL_REVISIONS.find(function(x){return x[0]===\'' + id + '\';}))" class="group flex items-start gap-1.5 text-left w-full hover:opacity-80 transition-opacity">'
        + '<span class="mt-0.5 text-purple-400 shrink-0 text-xs">📝</span>'
        + '<span class="text-xs text-gray-600 line-clamp-2 leading-relaxed group-hover:text-purple-700 transition-colors">' + r[15] + '</span>'
      + '</button>'
    : '<span class="text-gray-300 text-xs">—</span>';
  cells[12].innerHTML = noteCell;
}

/* ================================================================
   STATE
================================================================ */
var _revProjectLinked = false;
var _revTaskLinked    = false;
var _revLinkedTaskId  = "";
var _revSearchTimer   = null;
var _revTaskCache     = [];  /* stores loaded tasks so onclick can reference by index */

/* ================================================================
   PROJECT SEARCH & LOOKUP
================================================================ */
function _revProjectSearchDebounce() {
  if (_revSearchTimer) clearTimeout(_revSearchTimer);
  _revSearchTimer = setTimeout(function() {
    var q = _val("rev_projectId");
    if (!q || q.length < 2) { _hideRevSuggestions(); return; }
    if (q.startsWith("PRJ-")) { lookupRevisionProject(); return; }
    google.script.run
      .withFailureHandler(function(){})
      .withSuccessHandler(function(results) { _showRevSuggestions(results || []); })
      .searchProjects(q);
  }, 350);
}

function _showRevSuggestions(results) {
  var box = document.getElementById("rev_searchSuggestions");
  if (!box) return;
  if (!results.length) { box.style.display = "none"; return; }
  box.innerHTML = results.map(function(p) {
    return '<button type="button" onclick="_selectRevProjectSuggestion(\'' + p[0] + '\')"' +
      ' class="w-full text-left px-4 py-2.5 hover:bg-purple-50 transition-colors">' +
      '<div class="text-sm font-semibold text-gray-800">' + (p[2]||"—") + '</div>' +
      '<div class="text-xs text-gray-400">' + (p[1]||"—") + ' · ID: ' + p[0] + ' · ' + (p[6]||0) + ' langs</div>' +
      '</button>';
  }).join("");
  box.style.display = "block";
}

function _hideRevSuggestions() {
  var box = document.getElementById("rev_searchSuggestions");
  if (box) box.style.display = "none";
}

function _selectRevProjectSuggestion(id) {
  _hideRevSuggestions();
  _setVal("rev_projectId", id);
  lookupRevisionProject();
}

function _clearRevProjectLink() {
  _revProjectLinked = false;
  _revTaskLinked    = false;
  _revLinkedTaskId  = "";
  _setVal("rev_projectId", "");
  ["rev_projectPreview","rev_projectNotFound","rev_searchSuggestions",
   "rev_taskStep","rev_detailStep","rev_submitBar"].forEach(function(id){
    var el = document.getElementById(id);
    if (el) el.style.display = "none";
  });
}

function lookupRevisionProject() {
  _hideRevSuggestions();
  var id = _val("rev_projectId");
  if (!id) { showToast("Enter a Project ID or name first.", "warning"); return; }
  showLoader("Looking up project...");
  google.script.run
    .withFailureHandler(function(e){ hideLoader(); showToast("Lookup failed: "+e.message,"error"); })
    .withSuccessHandler(function(res){
      hideLoader();
      var prev = document.getElementById("rev_projectPreview");
      var notF = document.getElementById("rev_projectNotFound");
      if (!res || !res.project) {
        _revProjectLinked = false;
        if (prev) prev.style.display = "none";
        if (notF) notF.style.display = "block";
        return;
      }
      var p = res.project;
      _revProjectLinked = true;
      _setVal("rev_projectId", p[0]);
      if (notF) notF.style.display = "none";
      if (prev) prev.style.display = "block";
      _set("rev_preview_name",   p[2]);
      _set("rev_preview_client", "Client: " + (p[1]||"—"));
      _set("rev_preview_langs",  "Languages: " + (p[5]||"—") + " (" + (p[6]||0) + " langs)");
      /* Load tasks for this project */
      _loadRevTasksForProject(p[0]);
    })
    .getProjectById(id);
}

/* ================================================================
   TASK LOADING & SELECTION
================================================================ */
function _loadRevTasksForProject(projectId) {
  _showRevStep("rev_taskStep");
  var loadingEl = document.getElementById("rev_taskLoading");
  var listEl    = document.getElementById("rev_taskList");
  var noEl      = document.getElementById("rev_noTasks");
  var prevEl    = document.getElementById("rev_taskPreview");
  if (loadingEl) loadingEl.style.display = "block";
  if (listEl)    listEl.style.display    = "none";
  if (noEl)      noEl.style.display      = "none";
  if (prevEl)    prevEl.style.display    = "none";
  /* Hide detail step until task is selected */
  ["rev_detailStep","rev_submitBar"].forEach(function(id){
    var el = document.getElementById(id);
    if (el) el.style.display = "none";
  });

  google.script.run
    .withFailureHandler(function(){ if (loadingEl) loadingEl.style.display = "none"; })
    .withSuccessHandler(function(tasks){
      if (loadingEl) loadingEl.style.display = "none";
      tasks = tasks || [];
      if (!tasks.length) {
        if (noEl) noEl.style.display = "block";
        return;
      }
      if (listEl) {
        _revTaskCache = tasks;
        listEl.style.display = "block";
        listEl.innerHTML = tasks.map(function(t, idx) {
          var who = t[5]==="Vendor" ? (t[7]||"—") : (t[6]||"—");
          var rateStr = (t[22] !== "" && t[22] !== null && t[22] !== undefined && Number(t[22]) > 0)
            ? (t[23]||"")+" "+Number(t[22]).toLocaleString()+"/pg" : "No rate";
          var sc = getStatusClass(t[12]||"Pending");
          var tc = getTaskClass(t[4]||"Main DTP");
          return '<button type="button" onclick="_selectRevTask(' + idx + ')"' +
            ' class="w-full text-left p-3 rounded-xl border-2 border-gray-100 hover:border-blue-400 hover:bg-blue-50 transition-all">' +
            '<div class="flex items-center justify-between gap-2 flex-wrap">' +
              '<div class="flex items-center gap-2">' +
                '<span class="badge ' + tc + '">' + (t[4]||"—") + '</span>' +
                '<span class="text-sm font-semibold text-gray-800">' + (t[8]||"—") + '</span>' +
                '<span class="badge ' + sc + ' text-[9px]">' + (t[12]||"Pending") + '</span>' +
              '</div>' +
              '<div class="flex items-center gap-3 text-xs text-gray-500">' +
                '<span>👤 ' + who + '</span>' +
                '<span class="font-semibold text-emerald-700">' + rateStr + '</span>' +
                '<span class="font-mono text-gray-400">' + t[0] + '</span>' +
              '</div>' +
            '</div>' +
            '<div class="text-xs text-gray-400 mt-1">' + (Number(t[10])||0) + ' pages · ' + (t[5]||"In-House") + '</div>' +
          '</button>';
        }).join("");
      }
    })
    .getTasksByProjectId(projectId);
}

function _selectRevTask(idxOrObj) {
  var t = (typeof idxOrObj === "number") ? _revTaskCache[idxOrObj] : idxOrObj;
  if (!t) { showToast("Task data not found.", "error"); return; }
  _revTaskLinked   = true;
  _revLinkedTaskId = t[0];

  /* Show task preview */
  var prevEl = document.getElementById("rev_taskPreview");
  var listEl = document.getElementById("rev_taskList");
  if (listEl)  listEl.style.display  = "none";
  if (prevEl) {
    prevEl.style.display = "block";
    var who = t[5]==="Vendor" ? (t[7]||"—") : (t[6]||"—");
    _set("rev_tp_id",     t[0]);
    _set("rev_tp_type",   t[4]||"—");
    _set("rev_tp_lang",   t[8]||"—");
    _set("rev_tp_who",    who);
    _set("rev_tp_pages",  (Number(t[10])||0) + " pages");
    _set("rev_tp_wt",     t[5]||"In-House");
    _set("rev_tp_rate",   t[22] ? (t[23]||"")+" "+Number(t[22]).toLocaleString()+"/pg" : "—");
    _set("rev_tp_status", t[12]||"—");
  }

  /* Auto-fill language from task — no rate auto-fill */
  _setVal("rev_language", t[8] || "");

  /* Auto-fill revision number based on existing revisions for this task */
  google.script.run
    .withFailureHandler(function() {})
    .withSuccessHandler(function(revs) {
      var count = (revs || []).filter(function(r) {
        return String(r[2]).trim() === String(t[0]).trim();
      }).length;
      _setVal("rev_revisionNumber", "R" + (count + 1));
    })
    .getRevisionsByProjectId(_val("rev_projectId"));

  /* Set work type radio to match task */
  var wt    = t[5] || "In-House";
  var radio = document.querySelector('input[name="rev_workType"][value="'+wt+'"]');
  if (radio) { radio.checked = true; _updateWorkTypeBtns("rev_workType","rev_wt_inhouse_btn","rev_wt_vendor_btn"); }

  /* Auto-select assignee/vendor in dropdowns */
  _syncRevAssignmentFields();
  if (wt === "In-House") {
    var aEl = document.getElementById("rev_assignedTo");
    if (aEl && t[6]) {
      for (var i = 0; i < aEl.options.length; i++) {
        if (aEl.options[i].value === t[6]) { aEl.selectedIndex = i; break; }
      }
    }
  } else {
    var vEl = document.getElementById("rev_vendorName");
    if (vEl && t[7]) {
      for (var j = 0; j < vEl.options.length; j++) {
        if (vEl.options[j].value === t[7]) { vEl.selectedIndex = j; break; }
      }
    }
  }

  _showRevStep("rev_detailStep");
  _showRevStep("rev_submitBar");
  _onRevPaymentStatusChange();

  /* Scroll to detail step */
  var ds = document.getElementById("rev_detailStep");
  if (ds) ds.scrollIntoView({ behavior: "smooth", block: "start" });
}

function _clearRevTaskLink() {
  _revTaskLinked   = false;
  _revLinkedTaskId = "";
  var prevEl = document.getElementById("rev_taskPreview");
  var listEl = document.getElementById("rev_taskList");
  if (prevEl) prevEl.style.display = "none";
  if (listEl) listEl.style.display = "block";
  ["rev_detailStep","rev_submitBar"].forEach(function(id){
    var el = document.getElementById(id);
    if (el) el.style.display = "none";
  });
}

function _showRevStep(id) {
  var el = document.getElementById(id);
  if (el) el.style.display = "";
}

/* ================================================================
   LIVE ESTIMATE PREVIEW
================================================================ */
function _updateRevEstimate() {
  var pages = Number(_val("rev_pages"))       || 0;
  var rate  = Number(_val("rev_ratePerPage")) || 0;
  var cur   = _val("rev_currency") || "";
  var el    = document.getElementById("rev_estAmountPreview");
  if (!el) return;
  if (pages > 0 && rate > 0) {
    el.innerText = (cur ? cur + " " : "") + (pages * rate).toLocaleString();
  } else {
    el.innerText = "—";
  }
}

/* ================================================================
   DROPDOWNS
================================================================ */
function loadRevisionDropdowns(cb) {
  google.script.run
    .withFailureHandler(function(){ if (typeof cb==="function") cb(); })
    .withSuccessHandler(function(d){
      if (d) {
        var tOpts = (d.team||[]).map(function(m){
          var sub = [m.role, m.specialization].filter(Boolean).join(" · ");
          return '<option value="'+m.name+'" data-rate="'+(m.ratePerPage||0)+'" data-currency="'+(m.currency||'')+'">'+
            m.name+(sub?' ('+sub+')':'')+'</option>';
        }).join("");
        var vOpts = (d.vendors||[]).map(function(v){
          var sub = [v.specialization, v.languages].filter(Boolean).join(" · ");
          return '<option value="'+v.name+'" data-rate="'+(v.ratePerPage||0)+'" data-currency="'+(v.currency||'')+'">'+
            v.name+(sub?' ('+sub+')':'')+'</option>';
        }).join("");
        var aEl = document.getElementById("rev_assignedTo");
        var vEl = document.getElementById("rev_vendorName");
        if (aEl) {
          aEl.innerHTML = '<option value="">— Select Team Member —</option>' + tOpts;
        }
        if (vEl) {
          vEl.innerHTML = '<option value="">— Select Vendor —</option>' + vOpts;
        }
      }
      _syncRevAssignmentFields();
      if (typeof cb === "function") cb();
    })
    .getDropdownData();
}

function _autoFillRevRateFromMember() {}
function _autoFillRevRateFromVendor() {}

function _onRevPaymentStatusChange() {
  var sel  = document.getElementById("rev_paymentStatus");
  var rate = document.getElementById("rev_ratePerPage");
  if (!sel || !rate) return;
  var paid = sel.value === "Paid";
  rate.disabled = !paid;
  rate.classList.toggle("bg-gray-100", !paid);
  rate.classList.toggle("text-gray-400", !paid);
  if (!paid) rate.value = "";
}

function _onRevWorkTypeClick(wt) {
  var radio = document.querySelector('input[name="rev_workType"][value="' + wt + '"]');
  if (radio) radio.checked = true;
  _updateWorkTypeBtns("rev_workType", "rev_wt_inhouse_btn", "rev_wt_vendor_btn");
  _syncRevAssignmentFields();
}

function _syncRevAssignmentFields() {
  var wtEl = document.querySelector('input[name="rev_workType"]:checked');
  var wt   = wtEl ? wtEl.value : "In-House";
  var aRow = document.getElementById("rev_assignedToRow");
  var vRow = document.getElementById("rev_vendorRow");
  if (aRow) aRow.style.display = wt === "In-House" ? "" : "none";
  if (vRow) vRow.style.display = wt === "Vendor"   ? "" : "none";
}

/* ================================================================
   FORM SUBMIT
================================================================ */
(function(){
  var _revSubmitting = false;
  document.addEventListener("submit", function(e){
    if (!e.target || e.target.id !== "revisionForm") return;
    e.preventDefault();
    if (_revSubmitting) return;

    var editId = document.getElementById("contentArea").dataset.editRevId || "";
    var projId = _val("rev_projectId");
    if (!projId)          { showToast("Project ID is required.","error"); return; }
    if (!_revProjectLinked){ showToast("Please lookup and verify the Project ID first.","warning"); return; }

    var lang  = _val("rev_language");
    var pages = _val("rev_pages");
    if (!lang)                    { showToast("Language is required.","error"); return; }
    if (!pages||Number(pages)<=0) { showToast("Enter valid revision pages.","error"); return; }

    var wtEl = document.querySelector('input[name="rev_workType"]:checked');
    var wt   = wtEl ? wtEl.value : "In-House";

    var d = {
      projectId:     projId,
      taskId:        _revLinkedTaskId || "",
      revisionNumber:_val("rev_revisionNumber"),
      revisionType:  _val("rev_revisionType"),
      language:      lang,
      revisionPages: pages,
      workType:      wt,
      assignedTo:    _val("rev_assignedTo"),
      vendorName:    _val("rev_vendorName"),
      status:        _val("rev_status"),
      revisionDate:  _val("rev_revisionDate"),
      deliveryDate:  _val("rev_deliveryDate"),
      notes:         _val("rev_notes"),
      ratePerPage:   _val("rev_ratePerPage"),
      currency:      _val("rev_currency") || "",
      paymentStatus: _val("rev_paymentStatus") || "Unpaid"
    };

    var btn   = document.getElementById("revSubmitBtn");
    var lblEl = document.getElementById("revSubmitLabel");
    _revSubmitting = true;
    btn.disabled = true;
    if (lblEl) lblEl.innerText = "Saving...";
    showLoader("Saving revision...");

    if (editId) {
      var wtEl2 = document.querySelector('input[name="rev_workType"]:checked');
      var wt2   = wtEl2 ? wtEl2.value : "In-House";
      var current = {
        revisionNumber: _val("rev_revisionNumber"), revisionType: _val("rev_revisionType"),
        language: _val("rev_language"), revisionPages: _val("rev_pages"),
        workType: wt2, assignedTo: _val("rev_assignedTo"), vendorName: _val("rev_vendorName"),
        status: _val("rev_status"), revisionDate: _val("rev_revisionDate"),
        deliveryDate: _val("rev_deliveryDate"), notes: _val("rev_notes"),
        ratePerPage: _val("rev_ratePerPage"),
        paymentStatus: _val("rev_paymentStatus") || "Unpaid"
      };
      var diff = {};
      Object.keys(current).forEach(function(k) {
        if (String(current[k]) !== String(_revOriginal[k] !== undefined ? _revOriginal[k] : "")) {
          diff[k] = current[k];
        }
      });
      if (!Object.keys(diff).length) { _revSubmitting = false; btn.disabled = false; if (lblEl) lblEl.innerText = "Update Revision"; hideLoader(); showToast("No changes detected.", "info"); return; }
      _revSubmitting = true;
      btn.disabled = true;
      if (lblEl) lblEl.innerText = "Saving...";
      showLoader("Updating revision...");
      google.script.run
        .withFailureHandler(function(er){ _revSubmitting=false; hideLoader(); btn.disabled=false; if(lblEl) lblEl.innerText="Update Revision"; showToast("Error: "+er.message,"error"); })
        .withSuccessHandler(function(res){
          _revSubmitting=false;
          hideLoader();
          showToast("Revision updated!","success");
          if (res && res.updated) {
            var idx = ALL_REVISIONS.findIndex(function(r){ return r[0]===editId; });
            if (idx !== -1) {
              ALL_REVISIONS[idx] = res.updated;
              _revFiltered = _revFiltered.map(function(r){ return r[0]===editId ? res.updated : r; });
              _patchRevisionRow(editId, res.updated);
              _renderRevStats(ALL_REVISIONS);
            }
          }
          loadPage("revisions");
        })
        .updateRevision(editId, diff);
    } else {
      google.script.run
        .withFailureHandler(function(er){ _revSubmitting=false; hideLoader(); btn.disabled=false; if(lblEl) lblEl.innerText="Save Revision"; showToast("Error: "+er.message,"error"); })
        .withSuccessHandler(function(){ _revSubmitting=false; hideLoader(); showToast("Revision saved!","success"); loadPage("revisions"); })
        .addRevision(d);
    }
  });
})();
</script>
