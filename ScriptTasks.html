<script>
/* ================================================================
   ScriptTasks.html
================================================================ */
var ALL_TASKS = [];

/* ── state for the task form project link ── */
var _taskProjectLinked  = false;  // true = existing project confirmed
var _taskProjectIsNew   = false;  // true = user is creating a new project inline
var _taskSearchTimer    = null;

function loadTasks() {
  showLoader("Loading tasks...");
  google.script.run
    .withFailureHandler(function(e){ hideLoader(); showToast("Could not load tasks: "+e.message,"error"); })
    .withSuccessHandler(function(data){
      ALL_TASKS = data || [];
      _renderTaskStats(ALL_TASKS);
      _renderTasksTable(ALL_TASKS);
      hideLoader();
    })
    .getTasks();
}

function _renderTaskStats(data) {
  var pages  = data.reduce(function(s,r){ return s+(Number(r[10])||0); },0);
  var inProg = data.filter(function(r){ return r[12]==="In Progress"; }).length;
  var done   = data.filter(function(r){ return r[12]==="Completed"; }).length;
  _set("task_stat_total",  data.length);
  _set("task_stat_pages",  pages.toLocaleString());
  _set("task_stat_inprog", inProg);
  _set("task_stat_done",   done);
}

function _renderTasksTable(data) {
  var tbody = document.getElementById("tasksTable");
  if (!tbody) return;
  if (!data.length) {
    tbody.innerHTML = '<tr><td colspan="9" class="py-16 text-center text-slate-400 text-sm">No tasks found.</td></tr>';
    return;
  }
  tbody.innerHTML = data.map(function(r) {
    var sc  = getStatusClass(r[12] || "Pending");
    var tc  = getTaskClass(r[4]   || "Main DTP");
    var who = r[5]==="Vendor" ? (r[7]||r[6]||"—") : (r[6]||"—");
    return '<tr>' +
      '<td class="font-mono text-[11px] text-gray-400">' + r[0] + '</td>' +
      '<td><div class="font-semibold text-gray-900 text-sm">' + (r[3]||"—") + '</div>' +
          '<div class="text-xs text-gray-500">' + (r[2]||"—") + '</div></td>' +
      '<td><span class="badge ' + tc + '">' + (r[4]||"—") + '</span></td>' +
      '<td class="text-sm text-gray-600">' + (r[8]||"—") + '</td>' +
      '<td class="text-sm text-gray-600">' + who + '</td>' +
      '<td><span class="badge ' + sc + '">' + (r[12]||"Pending") + '</span></td>' +
      '<td class="text-center font-bold text-blue-600 text-sm">' + (Number(r[10])||0) + '</td>' +
      '<td class="text-xs text-gray-500">' + (r[15]||"—") + '</td>' +
      '<td class="text-right">' +
        '<div class="flex justify-end gap-1">' +
          btnStatus(r[0], "openTaskQuickEdit") +
          btnEdit(r[0],   "editTaskFull") +
          btnDelete(r[0], "deleteTaskById") +
        '</div>' +
      '</td>' +
    '</tr>';
  }).join("");
}

function filterTasks() {
  var q  = (_val("task_search")      ||"").toLowerCase();
  var st = _val("task_statusFilter") ||"";
  var tt = _val("task_typeFilter")   ||"";
  var wt = _val("task_workFilter")   ||"";
  var filtered = ALL_TASKS.filter(function(r){
    var mq = !q  || [r[0],r[1],r[2],r[3],r[8]].some(function(v){ return String(v).toLowerCase().includes(q); });
    var ms = !st || r[12]===st;
    var mt = !tt || r[4] ===tt;
    var mw = !wt || r[5] ===wt;
    return mq&&ms&&mt&&mw;
  });
  _renderTasksTable(filtered);
}

function openTaskQuickEdit(id) {
  var task = ALL_TASKS.find(function(r){ return r[0]===id; });
  if (!task) { showToast("Task not found.","error"); return; }
  document.getElementById("m_itemId").innerText   = id;
  document.getElementById("m_itemName").innerText = task[3]||task[4]||"—";
  document.getElementById("m_status").value       = task[12]||"Pending";
  document.getElementById("m_deliveryDate").value = formatForInput(task[15]);
  document.getElementById("editModal").dataset.editType = "task";
  document.getElementById("editModal").style.display    = "flex";
}

function editTaskFull(id) { loadPage("addTask",{editId:id}); }

function loadTaskForEdit(id) {
  showLoader("Loading task...");
  google.script.run
    .withFailureHandler(function(e){ hideLoader(); showToast("Could not load task: "+e.message,"error"); })
    .withSuccessHandler(function(res){
      hideLoader();
      if (!res||!res.task){ showToast("Task not found.","error"); return; }
      var t=res.task;
      var titleEl=document.getElementById("addTaskTitle");
      var lblEl  =document.getElementById("taskSubmitLabel");
      if (titleEl) titleEl.innerText="Edit Task";
      if (lblEl)   lblEl.innerText  ="Update Task";
      _setVal("task_projectId",      t[1]);
      _setVal("task_taskType",       t[4]);
      _setVal("task_language",       t[8]);
      _setVal("task_sourcePages",    t[9]);
      _setVal("task_langCount",      t[11]);
      _setVal("task_finalPages",     t[10]);
      _setVal("task_status",         t[12]);
      _setVal("task_priority",       t[13]);
      _setVal("task_startDate",      formatForInput(t[14]));
      _setVal("task_deliveryDate",   formatForInput(t[15]));
      _setVal("task_completedDate",  formatForInput(t[16]));
      _setVal("task_sourceLink",     t[17]);
      _setVal("task_deliverableLink",t[18]);
      _setVal("task_notes",          t[19]);
      var wt=t[5]||"In-House";
      var radio=document.querySelector('input[name="task_workType"][value="'+wt+'"]');
      if (radio){ radio.checked=true; _updateWorkTypeBtns("task_workType","wt_inhouse_btn","wt_vendor_btn"); }
      _setVal("task_assignedTo",t[6]);
      _setVal("task_vendorName",t[7]);
      if (typeof _syncTaskAssignmentFields==="function") _syncTaskAssignmentFields();
      if (typeof onTaskTypeChange==="function") onTaskTypeChange();
      /* For edit mode, just show the project ID as linked without re-lookup */
      _taskProjectLinked = true;
      _taskProjectIsNew  = false;
      var prev = document.getElementById("task_projectPreview");
      var notF = document.getElementById("task_projectNotFound");
      if (prev) prev.style.display = "block";
      if (notF) notF.style.display = "none";
      _set("task_preview_name",   t[3] || "—");
      _set("task_preview_client", "Client: " + (t[2] || "—"));
      _set("task_preview_langs",  "Project ID: " + (t[1] || "—") + " · Language: " + (t[8] || "—"));
    })
    .getTaskById(id);
}

function deleteTaskById(id) {
  customConfirm("Delete task "+id+"? This cannot be undone.", function(){
    showLoader("Deleting...");
    google.script.run
      .withFailureHandler(function(e){ hideLoader(); showToast("Delete failed: "+e.message,"error"); })
      .withSuccessHandler(function(){ hideLoader(); showToast("Task deleted.","warning"); loadTasks(); })
      .deleteTask(id);
  }, true);
}

/* ================================================================
   PROJECT LOOKUP — smart: search by ID or name, show suggestions
================================================================ */
function _taskProjectSearchDebounce() {
  if (_taskSearchTimer) clearTimeout(_taskSearchTimer);
  _taskSearchTimer = setTimeout(function() {
    var q = _val("task_projectId");
    if (!q || q.length < 2) { _hideSuggestions(); return; }
    /* If it looks like a full PRJ- id, do direct lookup */
    if (q.startsWith("PRJ-")) { lookupTaskProject(); return; }
    /* Otherwise search by name */
    google.script.run
      .withFailureHandler(function(){})
      .withSuccessHandler(function(results) {
        _showSuggestions(results || []);
      })
      .searchProjects(q);
  }, 350);
}

function _showSuggestions(results) {
  var box = document.getElementById("task_searchSuggestions");
  if (!box) return;
  if (!results.length) { box.style.display = "none"; return; }
  box.innerHTML = results.map(function(p) {
    return '<button type="button" onclick="_selectProjectSuggestion(\'' + p[0] + '\')"' +
      ' class="w-full text-left px-4 py-2.5 hover:bg-sky-50 transition-colors">' +
      '<div class="text-sm font-semibold text-gray-800">' + (p[2]||"—") + '</div>' +
      '<div class="text-xs text-gray-400">' + (p[1]||"—") + ' · ID: ' + p[0] + ' · ' + (p[6]||0) + ' langs</div>' +
      '</button>';
  }).join("");
  box.style.display = "block";
}

function _hideSuggestions() {
  var box = document.getElementById("task_searchSuggestions");
  if (box) box.style.display = "none";
}

function _selectProjectSuggestion(id) {
  _hideSuggestions();
  _setVal("task_projectId", id);
  lookupTaskProject();
}

function lookupTaskProject() {
  _hideSuggestions();
  var id = _val("task_projectId");
  if (!id) { showToast("Enter a Project ID or name first.","warning"); return; }
  showLoader("Looking up project...");
  google.script.run
    .withFailureHandler(function(e){ hideLoader(); showToast("Lookup failed: "+e.message,"error"); })
    .withSuccessHandler(function(res){
      hideLoader();
      var prev = document.getElementById("task_projectPreview");
      var notF = document.getElementById("task_projectNotFound");
      var newP = document.getElementById("task_newProjectPanel");
      if (!res || !res.project) {
        /* Not found — show amber warning + offer to create */
        _taskProjectLinked = false;
        _taskProjectIsNew  = false;
        if (prev) prev.style.display = "none";
        if (notF) notF.style.display = "block";
        if (newP) newP.style.display = "none";
        /* Pre-fill new project name from what user typed */
        var typed = _val("task_projectId");
        if (typed && !typed.startsWith("PRJ-")) {
          _setVal("np_projectName", typed);
        }
        return;
      }
      /* Found — show green preview */
      var p = res.project;
      _taskProjectLinked = true;
      _taskProjectIsNew  = false;
      if (notF) notF.style.display = "none";
      if (newP) newP.style.display = "none";
      if (prev) prev.style.display = "block";
      _set("task_preview_name",   p[2]);
      _set("task_preview_client", "Client: " + (p[1]||"—"));
      _set("task_preview_langs",  "Languages: " + (p[5]||"—") + " (" + (p[6]||0) + " langs)");
      /* Auto-fill lang count into task if empty */
      if (!_val("task_langCount") && p[6]) _setVal("task_langCount", p[6]);
    })
    .getProjectById(id);
}

function _clearProjectLink() {
  _taskProjectLinked = false;
  _taskProjectIsNew  = false;
  _setVal("task_projectId", "");
  var prev = document.getElementById("task_projectPreview");
  var notF = document.getElementById("task_projectNotFound");
  var newP = document.getElementById("task_newProjectPanel");
  if (prev) prev.style.display = "none";
  if (notF) notF.style.display = "none";
  if (newP) newP.style.display = "none";
}

function _showNewProjectPanel() {
  _taskProjectIsNew = true;
  var notF = document.getElementById("task_projectNotFound");
  var newP = document.getElementById("task_newProjectPanel");
  if (notF) notF.style.display = "none";
  if (newP) newP.style.display = "block";
  /* Focus client name */
  var el = document.getElementById("np_clientName");
  if (el) el.focus();
}

function _hideNewProjectPanel() {
  _taskProjectIsNew = false;
  var newP = document.getElementById("task_newProjectPanel");
  var notF = document.getElementById("task_projectNotFound");
  if (newP) newP.style.display = "none";
  if (notF) notF.style.display = "block";
}

/* Sync lang count from new-project panel into task lang count field */
function _syncLangCountFromProject() {
  var npLang = _val("np_langCount");
  if (npLang && !_val("task_langCount")) {
    _setVal("task_langCount", npLang);
  }
}

/* ================================================================
   PAGE CALC
================================================================ */
function initTaskPageCalc() {
  var src  = document.getElementById("task_sourcePages");
  var lang = document.getElementById("task_langCount");
  var fin  = document.getElementById("task_finalPages");
  var mode = document.getElementById("task_pagesMode");
  if (!src||!lang||!fin) return;
  var manual = false;
  function calc() {
    if (manual) return;
    var v = (parseFloat(src.value)||0) * (parseFloat(lang.value)||0);
    fin.value = v > 0 ? v : "";
  }
  function setMode(m) {
    manual = m;
    if (!mode) return;
    mode.innerText = m ? "Manual" : "Auto";
    mode.className = "absolute right-3 top-1/2 -translate-y-1/2 text-[10px] font-bold uppercase px-2 py-0.5 rounded-full " +
      (m ? "bg-blue-100 text-blue-600" : "bg-yellow-200 text-yellow-700");
  }
  fin.addEventListener("input",  function(){ setMode(fin.value !== ""); if (!fin.value) calc(); });
  src.addEventListener("input",  calc);
  lang.addEventListener("input", calc);
}

function onTaskTypeChange() {
  var type = _val("task_taskType");
  var hint = document.getElementById("task_typeHint");
  var cfg = {
    "Main DTP":           "Tracking DTP Pages — final layout after translation. Final Pages = Source Pages × Languages.",
    "Pre-Engineering":    "Tracking Pre-Engineering Pages — initial file setup and preparation phase. Final Pages = Source Pages × Languages.",
    "Bilingual Creation": "Tracking Bilingual Pages — side-by-side layout task. Final Pages = Source Pages × Languages.",
    "QC":                 "Quality Control check — In-house or Vendor QC round. Final Pages = Source Pages × Languages.",
    "Others":             "Miscellaneous tasks that don't fit other categories. Final Pages = Source Pages × Languages."
  };
  if (hint) {
    if (cfg[type]) { hint.innerText = cfg[type]; hint.classList.remove("hidden"); }
    else           { hint.classList.add("hidden"); }
  }
}

function loadTaskDropdowns(cb) {
  google.script.run
    .withFailureHandler(function(){ if (typeof cb==="function") cb(); })
    .withSuccessHandler(function(d){
      if (d) {
        /* Team members — show name + role + specialization */
        var tOpts = (d.team || []).map(function(m) {
          var sub = [m.role, m.specialization].filter(Boolean).join(" · ");
          return '<option value="' + m.name + '">' + m.name + (sub ? ' (' + sub + ')' : '') + '</option>';
        }).join("");
        /* Vendors — show name + specialization + languages */
        var vOpts = (d.vendors || []).map(function(v) {
          var sub = [v.specialization, v.languages].filter(Boolean).join(" · ");
          return '<option value="' + v.name + '">' + v.name + (sub ? ' (' + sub + ')' : '') + '</option>';
        }).join("");

        var aEl = document.getElementById("task_assignedTo");
        var vEl = document.getElementById("task_vendorName");
        if (aEl) {
          aEl.innerHTML = '<option value="">— Select Team Member —</option>' + tOpts;
          if (!tOpts) aEl.innerHTML += '<option value="" disabled>No active team members found</option>';
        }
        if (vEl) {
          vEl.innerHTML = '<option value="">— Select Vendor —</option>' + vOpts;
          if (!vOpts) vEl.innerHTML += '<option value="" disabled>No active vendors found</option>';
        }
      }
      _syncTaskAssignmentFields();
      if (typeof cb==="function") cb();
    })
    .getDropdownData();
}

/* Show Assigned To for In-House, Vendor Name for Vendor */
function _syncTaskAssignmentFields() {
  var wtEl = document.querySelector('input[name="task_workType"]:checked');
  var wt   = wtEl ? wtEl.value : "In-House";
  var aRow = document.getElementById("task_assignedTo") && document.getElementById("task_assignedTo").closest("div");
  var vRow = document.getElementById("task_vendorRow");
  if (aRow) aRow.style.display = wt === "In-House" ? "" : "none";
  if (vRow) vRow.style.display = wt === "Vendor"   ? "" : "none";
}

/* ================================================================
   FORM SUBMIT — handles both existing-project and new-project flows
   _taskSubmitting flag prevents double-click duplicate submissions.
================================================================ */
var _taskSubmitting = false;

(function(){
  document.addEventListener("submit", function(e){
    if (!e.target || e.target.id !== "taskForm") return;
    e.preventDefault();
    if (_taskSubmitting) return;   /* double-click guard */

    var editId = document.getElementById("contentArea").dataset.editTaskId || "";
    var wtEl   = document.querySelector('input[name="task_workType"]:checked');
    var wt     = wtEl ? wtEl.value : "In-House";

    var taskData = {
      taskType:        _val("task_taskType"),
      workType:        wt,
      assignedTo:      _val("task_assignedTo"),
      vendorName:      _val("task_vendorName"),
      language:        _val("task_language"),
      sourcePages:     _val("task_sourcePages"),
      langCount:       _val("task_langCount"),
      finalPages:      _val("task_finalPages"),
      status:          _val("task_status"),
      priority:        _val("task_priority"),
      startDate:       _val("task_startDate"),
      deliveryDate:    _val("task_deliveryDate"),
      completedDate:   _val("task_completedDate"),
      sourceLink:      _val("task_sourceLink"),
      deliverableLink: _val("task_deliverableLink"),
      notes:           _val("task_notes")
    };

    if (!taskData.taskType) { showToast("Task Type is required.","error"); return; }

    var btn   = document.getElementById("taskSubmitBtn");
    var lblEl = document.getElementById("taskSubmitLabel");

    /* ── EDIT MODE ── */
    if (editId) {
      _taskSubmitting = true;
      btn.disabled = true;
      if (lblEl) lblEl.innerText = "Saving...";
      showLoader("Updating task...");
      google.script.run
        .withFailureHandler(function(er){ _taskSubmitting=false; hideLoader(); btn.disabled=false; if(lblEl) lblEl.innerText="Update Task"; showToast("Error: "+er.message,"error"); })
        .withSuccessHandler(function(){ _taskSubmitting=false; hideLoader(); showToast("Task updated!","success"); loadPage("tasks"); })
        .updateTask(editId, taskData);
      return;
    }

    /* ── NEW TASK: existing project ── */
    if (_taskProjectLinked) {
      var projId = _val("task_projectId");
      if (!projId) { showToast("Project ID is required.","error"); return; }
      taskData.projectId = projId;
      _taskSubmitting = true;
      btn.disabled = true;
      if (lblEl) lblEl.innerText = "Saving...";
      showLoader("Saving task...");
      google.script.run
        .withFailureHandler(function(er){ _taskSubmitting=false; hideLoader(); btn.disabled=false; if(lblEl) lblEl.innerText="Save Task"; showToast("Error: "+er.message,"error"); })
        .withSuccessHandler(function(){ _taskSubmitting=false; hideLoader(); showToast("Task saved!","success"); loadPage("tasks"); })
        .addTask(taskData);
      return;
    }

    /* ── NEW TASK: create project inline ── */
    if (_taskProjectIsNew) {
      var clientName  = _val("np_clientName");
      var projectName = _val("np_projectName");
      if (!clientName)  { showToast("Client Name is required for the new project.","error"); return; }
      if (!projectName) { showToast("Project Name is required for the new project.","error"); return; }
      var projectData = {
        clientName:      clientName,
        projectName:     projectName,
        coordinator:     _val("np_coordinator"),
        sourceLanguage:  _val("np_sourceLanguage") || "English",
        targetLanguages: _val("np_targetLanguages"),
        langCount:       _val("np_langCount"),
        sourcePages:     _val("np_sourcePages"),
        wordCount:       _val("np_wordCount"),
        receivedDate:    _val("np_receivedDate"),
        priority:        _val("np_priority") || "Medium",
        notes:           _val("np_notes")
      };
      _taskSubmitting = true;
      btn.disabled = true;
      if (lblEl) lblEl.innerText = "Creating project & saving task...";
      showLoader("Creating project and saving task...");
      google.script.run
        .withFailureHandler(function(er){ _taskSubmitting=false; hideLoader(); btn.disabled=false; if(lblEl) lblEl.innerText="Save Task"; showToast("Error: "+er.message,"error"); })
        .withSuccessHandler(function(res){
          _taskSubmitting=false;
          hideLoader();
          var msg = res.reused
            ? "Linked to existing project (" + res.projectId + ") & task saved!"
            : "New project created (" + res.projectId + ") & task saved!";
          showToast(msg, "success");
          loadPage("tasks");
        })
        .addTaskWithProject(projectData, taskData);
      return;
    }

    /* ── Neither linked nor new project panel open ── */
    showToast("Please link to an existing project or create a new one.","warning");
  });
})();
</script>
