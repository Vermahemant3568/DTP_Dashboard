<div class="space-y-5 page-enter">
  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
    <div>
      <h2 class="text-2xl font-bold text-slate-800">Team Members</h2>
      <p class="text-sm text-slate-500 mt-0.5">Manage in-house team members</p>
    </div>
    <button onclick="openTeamModal()"
      class="inline-flex items-center gap-2 bg-sky-600 hover:bg-sky-700 text-white text-sm font-semibold px-4 py-2.5 rounded-xl shadow-sm active:scale-95 transition-all">
      ➕ Add Member
    </button>
  </div>

  <div class="section-card overflow-hidden">
    <div class="overflow-x-auto">
      <table class="data-table">
        <thead>
          <tr>
            <th>Member ID</th>
            <th>Name</th>
            <th>Role</th>
            <th>Email</th>
            <th>Specialization</th>
            <th>Status</th>
            <th class="text-right">Actions</th>
          </tr>
        </thead>
        <tbody id="teamTable">
          <tr><td colspan="7" class="py-16 text-center text-slate-400 text-sm">Loading team members…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- TEAM MODAL -->
<div id="teamModal" style="display:none"
  class="fixed inset-0 z-[2000] flex items-center justify-center bg-black/50 px-4">
  <div class="w-full max-w-md rounded-2xl bg-white shadow-2xl">
    <div class="flex items-center justify-between border-b border-gray-100 p-5">
      <h3 id="teamModalTitle" class="text-base font-bold text-gray-800">Add Team Member</h3>
      <button onclick="closeTeamModal()" class="text-gray-400 hover:text-gray-600 text-lg leading-none">✕</button>
    </div>
    <div class="p-5 grid grid-cols-2 gap-4">
      <div class="col-span-2"><label class="label">Full Name *</label><input id="tm_name" class="input" placeholder="Full name" required></div>
      <div><label class="label">Role</label><input id="tm_role" class="input" placeholder="e.g. DTP Operator"></div>
      <div><label class="label">Email</label><input type="email" id="tm_email" class="input" placeholder="email@example.com"></div>
      <div><label class="label">Phone</label><input id="tm_phone" class="input" placeholder="+1 234 567 8900"></div>
      <div><label class="label">Specialization</label><input id="tm_spec" class="input" placeholder="e.g. InDesign, Illustrator"></div>
      <div><label class="label">Status</label><select id="tm_status" class="input"><option>Active</option><option>Inactive</option></select></div>
    </div>
    <div class="flex justify-end gap-3 border-t border-gray-100 p-4">
      <button onclick="closeTeamModal()" class="px-4 py-2 text-sm font-semibold text-gray-500 hover:bg-gray-100 rounded-xl transition-colors">Cancel</button>
      <button onclick="saveTeamMember()" class="px-5 py-2 text-sm font-semibold text-white bg-sky-600 hover:bg-sky-700 rounded-xl transition-colors">Save Member</button>
    </div>
  </div>
</div>
