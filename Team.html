<div class="space-y-4 page-enter">

  <!-- HEADER -->
  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
    <div>
      <h2 class="text-xl font-bold text-slate-800">Team Members</h2>
      <p class="text-xs text-slate-400 mt-0.5">In-house team — rates, roles &amp; performance</p>
    </div>
    <button onclick="openTeamModal()"
      class="inline-flex items-center gap-1.5 bg-sky-600 hover:bg-sky-700 text-white text-xs font-bold px-4 py-2 rounded-lg shadow-sm active:scale-95 transition-all">
      ➕ Add Member
    </button>
  </div>

  <!-- DYNAMIC STATS -->
  <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
    <div class="bg-white rounded-xl border border-gray-100 shadow-sm px-4 py-3">
      <p class="text-[10px] font-bold uppercase tracking-wider text-gray-400">Total</p>
      <p id="tm_stat_total" class="text-2xl font-black text-slate-800 mt-0.5">—</p>
    </div>
    <div class="bg-white rounded-xl border border-gray-100 shadow-sm px-4 py-3">
      <p class="text-[10px] font-bold uppercase tracking-wider text-emerald-500">Active</p>
      <p id="tm_stat_active" class="text-2xl font-black text-emerald-600 mt-0.5">—</p>
    </div>
    <div class="bg-white rounded-xl border border-gray-100 shadow-sm px-4 py-3">
      <p class="text-[10px] font-bold uppercase tracking-wider text-gray-400">Inactive</p>
      <p id="tm_stat_inactive" class="text-2xl font-black text-gray-400 mt-0.5">—</p>
    </div>
    <div class="bg-white rounded-xl border border-gray-100 shadow-sm px-4 py-3">
      <p class="text-[10px] font-bold uppercase tracking-wider text-sky-500">Roles</p>
      <p id="tm_stat_roles" class="text-2xl font-black text-sky-600 mt-0.5">—</p>
    </div>
  </div>

  <!-- FILTER + TABLE -->
  <div class="bg-white rounded-xl border border-gray-100 shadow-sm overflow-hidden">
    <div class="flex flex-col sm:flex-row gap-2 p-3 border-b border-gray-50">
      <div class="relative flex-1">
        <span class="absolute inset-y-0 left-3 flex items-center text-gray-400">
          <svg class="h-3.5 w-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        </span>
        <input type="text" id="tm_search" oninput="filterTeam()" placeholder="Search name, role, specialization…" class="input pl-8 py-2 text-xs">
      </div>
      <select id="tm_statusFilter" onchange="filterTeam()" class="input sm:w-32 py-2 text-xs">
        <option value="">All Status</option>
        <option>Active</option>
        <option>Inactive</option>
      </select>
      <button onclick="_resetTeamFilters()" class="shrink-0 px-3 py-2 text-xs font-semibold bg-gray-100 hover:bg-gray-200 text-gray-600 rounded-lg transition-all">Reset</button>
    </div>
    <div class="flex items-center px-4 py-2 border-b border-gray-50">
      <p id="tm_countLabel" class="text-xs text-gray-400 font-medium">Loading…</p>
    </div>
    <div class="overflow-x-auto">
      <table class="data-table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Name &amp; Role</th>
            <th>Email</th>
            <th>Specialization</th>
            <th class="text-center">Rate / Page</th>
            <th class="text-center">Status</th>
            <th class="text-right">Actions</th>
          </tr>
        </thead>
        <tbody id="teamTable">
          <tr><td colspan="7" class="py-16 text-center text-slate-400 text-sm">Loading team members…</td></tr>
        </tbody>
      </table>
    </div>
  </div>

</div>
