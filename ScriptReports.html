<script>
/* ================================================================
   ScriptReports.html — Monthly report rendering
================================================================ */

function loadReports() {
  var monthEl = document.getElementById("report_month");
  var yearEl  = document.getElementById("report_year");

  if (yearEl && !yearEl.options.length) {
    var now = new Date();
    for (var y = now.getFullYear(); y >= now.getFullYear() - 3; y--) {
      var opt = document.createElement("option");
      opt.value = y;
      opt.text  = y;
      if (y === now.getFullYear()) opt.selected = true;
      yearEl.appendChild(opt);
    }
  }

  if (monthEl && !monthEl.dataset.init) {
    monthEl.value        = new Date().getMonth() + 1;
    monthEl.dataset.init = "1";
  }

  var year  = yearEl  ? Number(yearEl.value)  : new Date().getFullYear();
  var month = monthEl ? Number(monthEl.value) : new Date().getMonth() + 1;

  showLoader("Generating report...");
  google.script.run
    .withFailureHandler(function(e) { hideLoader(); showToast("Report error: " + e.message, "error"); })
    .withSuccessHandler(function(d) {
      hideLoader();
      if (!d) return;
      _renderReport(d);
    })
    .getMonthlySummary({ year: year, month: month });
}

function _renderReport(d) {
  _set("report_subtitle", "Production report — " + (d.month || ""));
  _set("rpt_grandTotal",  (d.grandTotal    || 0).toLocaleString());
  _set("rpt_inHouse",     (d.totalInHouse  || 0).toLocaleString());
  _set("rpt_vendor",      (d.totalVendor   || 0).toLocaleString());
  _set("rpt_taskCount",   (d.taskCount     || 0));
  _set("rpt_revCount",    (d.revisionCount || 0) + " revisions");
  _set("rpt_qcPages",     ((d.byTaskType && d.byTaskType.qc) ? (d.byTaskType.qc.total || 0) : 0).toLocaleString());

  var bt = d.byTaskType || {};

  var ttEl = document.getElementById("rpt_taskTypeBars");
  if (ttEl) {
    var ttItems = [
      { label: "Main DTP",    val: (bt.mainDTP    || {total:0}).total, color: "bg-blue-500"   },
      { label: "Extraction",  val: (bt.extraction  || {total:0}).total, color: "bg-teal-500"   },
      { label: "Corrections", val: (bt.corrections || {total:0}).total, color: "bg-orange-500" },
      { label: "Bilingual",   val: (bt.bilingual   || {total:0}).total, color: "bg-violet-500" },
      { label: "QC",          val: (bt.qc          || {total:0}).total, color: "bg-green-500"  },
      { label: "Revisions",   val: (bt.revisions   || {total:0}).total, color: "bg-purple-500" }
    ];
    var ttMax = Math.max.apply(null, ttItems.map(function(i) { return i.val; })) || 1;
    ttEl.innerHTML = ttItems.map(function(i) {
      return buildBar(i.label, i.val, ttMax, i.color, "pages");
    }).join("<div class='mt-3'></div>");
  }

  var wtEl = document.getElementById("rpt_workTypeBars");
  if (wtEl) {
    var ih    = d.totalInHouse || 0;
    var vd    = d.totalVendor  || 0;
    var grand = (ih + vd) || 1;
    wtEl.innerHTML =
      buildBar("In-House", ih, grand, "bg-sky-500",   "pages (" + Math.round(ih / grand * 100) + "%)") +
      "<div class='mt-3'></div>" +
      buildBar("Vendor",   vd, grand, "bg-amber-400", "pages (" + Math.round(vd / grand * 100) + "%)");
  }

  var empEl = document.getElementById("rpt_employeeBars");
  if (empEl) {
    var emps = d.byEmployee || [];
    if (!emps.length) {
      empEl.innerHTML = '<p class="text-sm text-slate-400 text-center py-4">No data this month.</p>';
    } else {
      var empMax = emps[0].pages || 1;
      empEl.innerHTML = emps.slice(0, 8).map(function(e) {
        return buildBar(e.name, e.pages, empMax, "bg-sky-500", "pages (" + e.tasks + " tasks)");
      }).join("<div class='mt-3'></div>");
    }
  }

  var vndEl = document.getElementById("rpt_vendorBars");
  if (vndEl) {
    var vnds = d.byVendor || [];
    if (!vnds.length) {
      vndEl.innerHTML = '<p class="text-sm text-slate-400 text-center py-4">No vendor work this month.</p>';
    } else {
      var vndMax = vnds[0].pages || 1;
      vndEl.innerHTML = vnds.slice(0, 8).map(function(v) {
        return buildBar(v.name, v.pages, vndMax, "bg-amber-400", "pages (" + v.tasks + " tasks)");
      }).join("<div class='mt-3'></div>");
    }
  }

  var langEl = document.getElementById("rpt_languageBars");
  if (langEl) {
    var langs = d.byLanguage || [];
    if (!langs.length) {
      langEl.innerHTML = '<p class="text-sm text-slate-400 text-center py-4">No language data this month.</p>';
    } else {
      var langMax = langs[0].pages || 1;
      langEl.innerHTML = langs.slice(0, 10).map(function(l) {
        return buildBar(l.language, l.pages, langMax, "bg-violet-500", "pages");
      }).join("<div class='mt-3'></div>");
    }
  }
}
</script>
