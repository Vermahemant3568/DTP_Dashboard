<div class="space-y-5 page-enter">
  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
    <div>
      <h2 class="text-2xl font-bold text-slate-800">Vendors</h2>
      <p class="text-sm text-slate-500 mt-0.5">Manage outsourcing vendor list</p>
    </div>
    <button onclick="openVendorModal()"
      class="inline-flex items-center gap-2 bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-semibold px-4 py-2.5 rounded-xl shadow-sm active:scale-95 transition-all">
      ➕ Add Vendor
    </button>
  </div>

  <div class="section-card overflow-hidden">
    <div class="overflow-x-auto">
      <table class="data-table">
        <thead>
          <tr>
            <th>Vendor ID</th>
            <th>Vendor Name</th>
            <th>Contact</th>
            <th>Email</th>
            <th>Specialization</th>
            <th>Languages</th>
            <th class="text-center">Rate/Page</th>
            <th>Status</th>
            <th class="text-right">Actions</th>
          </tr>
        </thead>
        <tbody id="vendorsTable">
          <tr><td colspan="9" class="py-16 text-center text-slate-400 text-sm">Loading vendors…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- VENDOR MODAL -->
<div id="vendorModal" style="display:none"
  class="fixed inset-0 z-[2000] flex items-center justify-center bg-black/50 px-4">
  <div class="w-full max-w-lg rounded-2xl bg-white shadow-2xl">
    <div class="flex items-center justify-between border-b border-gray-100 p-5">
      <h3 id="vendorModalTitle" class="text-base font-bold text-gray-800">Add Vendor</h3>
      <button onclick="closeVendorModal()" class="text-gray-400 hover:text-gray-600 text-lg leading-none">✕</button>
    </div>
    <div class="p-5 grid grid-cols-2 gap-4">
      <div class="col-span-2"><label class="label">Vendor Name *</label><input id="vm_name" class="input" placeholder="Vendor company name" required></div>
      <div><label class="label">Contact Person</label><input id="vm_contact" class="input" placeholder="Contact name"></div>
      <div><label class="label">Email</label><input type="email" id="vm_email" class="input" placeholder="email@example.com"></div>
      <div><label class="label">Phone</label><input id="vm_phone" class="input" placeholder="+1 234 567 8900"></div>
      <div><label class="label">Specialization</label><input id="vm_spec" class="input" placeholder="e.g. DTP, Translation"></div>
      <div><label class="label">Languages</label><input id="vm_langs" class="input" placeholder="French, German, Spanish"></div>
      <div><label class="label">Rate Per Page</label><input type="number" id="vm_rate" class="input" placeholder="0.00" min="0" step="0.01"></div>
      <div><label class="label">Currency</label><select id="vm_currency" class="input"><option>USD</option><option>EUR</option><option>GBP</option><option>INR</option></select></div>
      <div><label class="label">Status</label><select id="vm_status" class="input"><option>Active</option><option>Inactive</option></select></div>
      <div class="col-span-2"><label class="label">Notes</label><textarea id="vm_notes" rows="2" class="input" placeholder="Additional notes…"></textarea></div>
    </div>
    <div class="flex justify-end gap-3 border-t border-gray-100 p-4">
      <button onclick="closeVendorModal()" class="px-4 py-2 text-sm font-semibold text-gray-500 hover:bg-gray-100 rounded-xl transition-colors">Cancel</button>
      <button onclick="saveVendor()" class="px-5 py-2 text-sm font-semibold text-white bg-emerald-600 hover:bg-emerald-700 rounded-xl transition-colors">Save Vendor</button>
    </div>
  </div>
</div>
