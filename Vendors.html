<div class="space-y-5 page-enter">
  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
    <div>
      <h2 class="text-2xl font-bold text-slate-800">Vendors</h2>
      <p class="text-sm text-slate-500 mt-0.5">Manage outsourcing vendor list</p>
    </div>
    <button onclick="openVendorModal()"
      class="inline-flex items-center gap-2 bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-semibold px-4 py-2.5 rounded-xl shadow-sm active:scale-95 transition-all">
      ➕ Add Vendor
    </button>
  </div>

  <div class="section-card overflow-hidden">
    <div class="overflow-x-auto">
      <table class="data-table">
        <thead>
          <tr>
            <th>Vendor ID</th>
            <th>Vendor Name</th>
            <th>Contact</th>
            <th>Email</th>
            <th>Specialization</th>
            <th>Languages</th>
            <th class="text-center">Rate/Page</th>
            <th>Status</th>
            <th class="text-right">Actions</th>
          </tr>
        </thead>
        <tbody id="vendorsTable">
          <tr><td colspan="9" class="py-16 text-center text-slate-400 text-sm">Loading vendors…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
