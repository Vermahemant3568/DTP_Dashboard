<script>
/* ================================================================
   ScriptNav.html — Routing, sidebar, refresh, quick edit, init
================================================================ */

const PAGE_MAP = {
  dashboard:      "Dashboard",
  projects:       "ManageProjects",
  addProject:     "AddProject",
  viewProject:    "ViewProject",
  addTask:        "AddTask",
  tasks:          "ManageTasks",
  revisions:      "Revisions",
  addRevision:    "AddRevision",
  reports:        "Reports",
  vendors:        "Vendors",
  team:           "Team"
};

let _isLoading  = false;
let _activePage = "dashboard";
let _pageCtx    = null;

/* ── MAIN ROUTER ── */
function loadPage(page, ctx) {
  if (_isLoading) return;
  _isLoading  = true;
  _activePage = page;
  _pageCtx    = ctx || null;

  showLoader("Loading\u2026");
  _setActiveNav(page);

  google.script.run
    .withFailureHandler(function(err) {
      _isLoading = false;
      hideLoader();
      showToast("Failed to load page: " + (err.message || err), "error");
    })
    .withSuccessHandler(function(html) {
      const area = document.getElementById("contentArea");
      area.innerHTML = html;
      area.className = "max-w-7xl mx-auto page-enter";
      _isLoading = false;
      _initPage(page, ctx);
    })
    .loadPageFile(PAGE_MAP[page] || "Dashboard");
}

function _initPage(page, ctx) {
  switch (page) {
    case "dashboard":
      refreshDashboardStats();
      break;
    case "projects":
      if (typeof loadProjects === "function") loadProjects();
      else hideLoader();
      break;
    case "addProject":
      hideLoader();
      break;
    case "viewProject":
      if (ctx && typeof renderViewProject === "function") renderViewProject(ctx);
      else hideLoader();
      break;
    case "addTask":
      _initAddTaskForm(ctx);
      break;
    case "tasks":
      if (typeof loadTasks === "function") loadTasks();
      else hideLoader();
      break;
    case "revisions":
      if (typeof loadRevisions === "function") loadRevisions();
      else hideLoader();
      break;
    case "addRevision":
      _initAddRevisionForm(ctx);
      hideLoader();
      break;
    case "reports":
      if (typeof loadReports === "function") loadReports();
      else hideLoader();
      break;
    case "vendors":
      if (typeof loadVendors === "function") loadVendors();
      else hideLoader();
      break;
    case "team":
      if (typeof loadTeam === "function") loadTeam();
      else hideLoader();
      break;
    default:
      hideLoader();
  }
}

/* ── PAGE INIT HELPERS ── */
function _initAddTaskForm(ctx) {
  /* load dropdowns first, then set context values */
  if (typeof loadTaskDropdowns === "function") {
    loadTaskDropdowns(function() {
      if (ctx && ctx.projectId) {
        _setVal("task_projectId", ctx.projectId);
        if (typeof lookupTaskProject === "function") lookupTaskProject();
      }
      if (ctx && ctx.editId) {
        document.getElementById("contentArea").dataset.editTaskId = ctx.editId;
        if (typeof loadTaskForEdit === "function") loadTaskForEdit(ctx.editId);
      }
      hideLoader();
    });
  } else {
    hideLoader();
  }
  if (typeof initTaskPageCalc === "function") initTaskPageCalc();
  _wireWorkTypeRadios("task_workType", "wt_inhouse_btn", "wt_vendor_btn");
}

function _initAddRevisionForm(ctx) {
  const dateEl = document.getElementById("rev_revisionDate");
  if (dateEl && !dateEl.value) dateEl.value = todayISO();
  if (typeof loadRevisionDropdowns === "function") {
    loadRevisionDropdowns(function() {
      if (ctx && ctx.projectId) {
        _setVal("rev_projectId", ctx.projectId);
        if (typeof lookupRevisionProject === "function") lookupRevisionProject();
      }
      if (ctx && ctx.editId) {
        document.getElementById("contentArea").dataset.editRevId = ctx.editId;
        if (typeof loadRevisionForEdit === "function") loadRevisionForEdit(ctx.editId);
      }
    });
  } else {
    if (ctx && ctx.projectId) {
      _setVal("rev_projectId", ctx.projectId);
      if (typeof lookupRevisionProject === "function") lookupRevisionProject();
    }
  }
  _wireWorkTypeRadios("rev_workType", "rev_wt_inhouse_btn", "rev_wt_vendor_btn");
}

function _wireWorkTypeRadios(radioName, inhouseBtnId, vendorBtnId) {
  document.querySelectorAll('input[name="' + radioName + '"]').forEach(function(radio) {
    radio.addEventListener("change", function() {
      _updateWorkTypeBtns(radioName, inhouseBtnId, vendorBtnId);
    });
  });
  _updateWorkTypeBtns(radioName, inhouseBtnId, vendorBtnId);
}

function _updateWorkTypeBtns(radioName, inhouseBtnId, vendorBtnId) {
  const checked = document.querySelector('input[name="' + radioName + '"]:checked');
  const isIH    = checked && checked.value === "In-House";
  const ihBtn   = document.getElementById(inhouseBtnId);
  const vBtn    = document.getElementById(vendorBtnId);
  const BASE    = "flex items-center justify-center gap-2 rounded-xl border-2 py-3 text-sm font-bold transition-all ";
  if (ihBtn) ihBtn.className = BASE + (isIH  ? "border-sky-500 bg-sky-50 text-sky-700"       : "border-gray-200 bg-gray-50 text-gray-400");
  if (vBtn)  vBtn.className  = BASE + (!isIH ? "border-amber-500 bg-amber-50 text-amber-700" : "border-gray-200 bg-gray-50 text-gray-400");
}

/* ── ACTIVE NAV HIGHLIGHT ── */
function _setActiveNav(page) {
  document.querySelectorAll("[data-nav]").forEach(function(el) {
    const isActive = el.dataset.nav === page;
    el.classList.toggle("bg-sky-500/15",  isActive);
    el.classList.toggle("text-sky-300",   isActive);
    el.classList.toggle("text-slate-300", !isActive);
  });
}

/* ── SIDEBAR TOGGLE ── */
function toggleSidebar() {
  const sidebar   = document.getElementById("sidebar");
  const main      = document.getElementById("mainContent");
  const labels    = document.querySelectorAll(".nav-label");
  const brand     = document.getElementById("sidebarBrand");
  const collapsed = sidebar.dataset.collapsed === "true";

  if (collapsed) {
    sidebar.classList.replace("w-20", "w-72");
    if (main) main.classList.replace("ml-20", "ml-72");
    labels.forEach(function(l) { l.classList.remove("hidden"); });
    if (brand) brand.style.display = "";
    sidebar.dataset.collapsed = "false";
  } else {
    sidebar.classList.replace("w-72", "w-20");
    if (main) main.classList.replace("ml-72", "ml-20");
    labels.forEach(function(l) { l.classList.add("hidden"); });
    if (brand) brand.style.display = "none";
    sidebar.dataset.collapsed = "true";
  }
}

/* ── GLOBAL QUICK EDIT MODAL ── */
function closeEditModal() {
  document.getElementById("editModal").style.display = "none";
}

function markCompleteNow() {
  document.getElementById("m_status").value       = "Completed";
  document.getElementById("m_deliveryDate").value = todayISO();
  saveQuickEdit();
}

function saveQuickEdit() {
  const id       = document.getElementById("m_itemId").innerText.trim();
  const status   = document.getElementById("m_status").value;
  const delivery = document.getElementById("m_deliveryDate").value;
  const editType = document.getElementById("editModal").dataset.editType || "task";
  if (!id) { showToast("No item selected.", "error"); return; }

  showLoader("Saving\u2026");

  if (editType === "project") {
    google.script.run
      .withFailureHandler(function(e) { hideLoader(); showToast("Update failed: " + e.message, "error"); })
      .withSuccessHandler(function() {
        hideLoader();
        closeEditModal();
        showToast("Status updated!", "success");
        if (typeof loadProjects === "function") loadProjects();
      })
      .updateProjectStatus(id, status);
  } else {
    google.script.run
      .withFailureHandler(function(e) { hideLoader(); showToast("Update failed: " + e.message, "error"); })
      .withSuccessHandler(function() {
        hideLoader();
        closeEditModal();
        showToast("Task updated!", "success");
        if (_activePage === "tasks"    && typeof loadTasks    === "function") loadTasks();
        if (_activePage === "projects" && typeof loadProjects === "function") loadProjects();
      })
      .updateTaskStatus(id, status, delivery);
  }
}

/* ── REFRESH ── */
function handleRefresh() {
  const btn  = document.getElementById("refreshBtn");
  const icon = document.getElementById("refreshIcon");
  if (btn)  btn.disabled   = true;
  if (icon) icon.innerText = "\u23F3";

  var refreshMap = {
    dashboard:  function() { refreshDashboardStats(); },
    projects:   function() { if (typeof loadProjects  === "function") loadProjects(); },
    tasks:      function() { if (typeof loadTasks     === "function") loadTasks(); },
    revisions:  function() { if (typeof loadRevisions === "function") loadRevisions(); },
    reports:    function() { if (typeof loadReports   === "function") loadReports(); },
    vendors:    function() { if (typeof loadVendors   === "function") loadVendors(); },
    team:       function() { if (typeof loadTeam      === "function") loadTeam(); }
  };

  if (refreshMap[_activePage]) refreshMap[_activePage]();

  setTimeout(function() {
    if (btn)  btn.disabled   = false;
    if (icon) icon.innerText = "\uD83D\uDD04";
    var el = document.getElementById("lastUpdated");
    if (el) el.innerText = new Date().toLocaleTimeString();
  }, 1500);
}

/* ── INIT ── */
window.addEventListener("load", function() {
  var main = document.getElementById("mainContent");
  if (main) { main.classList.remove("ml-64"); main.classList.add("ml-72"); }
  loadPage("dashboard");
});
</script>
