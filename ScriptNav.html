<script>
/* ================================================================
   ScriptNav.html — Routing, sidebar, refresh, quick edit, init
   GAS pattern: initApp() called from <body onload="initApp()">
================================================================ */

var PAGE_MAP = {
  dashboard:   "Dashboard",
  projects:    "ManageProjects",
  addProject:  "AddProject",
  viewProject: "ViewProject",
  addTask:     "AddTask",
  tasks:       "ManageTasks",
  viewTask:    "ViewTask",
  revisions:   "Revisions",
  addRevision: "AddRevision",
  vendors:     "Vendors",
  team:        "Team",
  vendorView:  "VendorView",
  memberView:  "TeamMemberView"
};

var _isLoading      = false;
var _loadingTimer   = null;
var _activePage     = "dashboard";
var _activeCtx      = null;
var _navHistory     = [];   /* in-app back-navigation stack [{page, ctx}] */

/* ── Back-button interception ── */
(function() {
  /* Push a dummy state so the browser has somewhere to go "back" to,
     which we intercept and replace with our own in-app navigation. */
  if (window.history && window.history.pushState) {
    window.history.pushState({ inApp: true }, "");
    window.addEventListener("popstate", function(e) {
      /* Always re-push so the browser never actually leaves the app */
      window.history.pushState({ inApp: true }, "");
      goBack();
    });
  }
})();

/* Navigate back one step in the in-app history stack */
function goBack() {
  if (_navHistory.length > 0) {
    var prev = _navHistory.pop();
    /* Load the previous page without pushing to history again */
    _loadPageInternal(prev.page, prev.ctx);
  } else {
    /* Nothing in stack — go to dashboard */
    _loadPageInternal("dashboard", null);
  }
}

/* Called by <body onload="initApp()"> — guaranteed google.script is ready */
function initApp() {
  /* Auto-collapse sidebar on small laptops (< 1280px) */
  var sidebar = document.getElementById("sidebar");
  var main    = document.getElementById("mainContent");
  if (sidebar) {
    if (window.innerWidth < 1280) {
      sidebar.style.width = "4rem";
      sidebar.dataset.collapsed = "true";
      document.querySelectorAll(".nav-label").forEach(function(l) { l.classList.add("hidden"); });
      var brand = document.getElementById("sidebarBrand");
      if (brand) brand.style.display = "none";
      if (main) main.style.marginLeft = "4rem";
    } else {
      sidebar.style.width = "16rem";
      sidebar.dataset.collapsed = "false";
      if (main) main.style.marginLeft = "16rem";
    }
  }
  loadPage("dashboard");
}

function _setLoading(on) {
  _isLoading = on;
  if (_loadingTimer) { clearTimeout(_loadingTimer); _loadingTimer = null; }
  if (on) {
    _loadingTimer = setTimeout(function() {
      _isLoading = false;
      hideLoader();
    }, 20000);
  }
}

function loadPage(page, ctx) {
  /* Push current page to history before navigating away (skip dashboard→dashboard) */
  if (_activePage && !(_activePage === page && JSON.stringify(ctx) === JSON.stringify(undefined))) {
    _navHistory.push({ page: _activePage, ctx: _activeCtx || null });
    /* Cap stack depth */
    if (_navHistory.length > 30) _navHistory.shift();
  }
  _activeCtx = ctx || null;
  _loadPageInternal(page, ctx);
}

function _loadPageInternal(page, ctx) {
  if (_isLoading) { _setLoading(false); }
  _setLoading(true);
  _activePage = page;
  _activeCtx  = ctx || null;

  showLoader("Loading...");
  _setActiveNav(page);

  google.script.run
    .withFailureHandler(function(err) {
      _setLoading(false);
      hideLoader();
      showToast("Page load failed: " + (err.message || err), "error");
    })
    .withSuccessHandler(function(html) {
      var area = document.getElementById("contentArea");
      if (!area) { _setLoading(false); hideLoader(); return; }
      area.innerHTML = html;
      area.className = "max-w-[1400px] mx-auto px-6 sm:px-8 lg:px-10 py-6 page-enter";
      _setLoading(false);
      _initPage(page, ctx);
    })
    .loadPageFile(PAGE_MAP[page] || "Dashboard");
}

function _initPage(page, ctx) {
  switch (page) {
    case "dashboard":
      if (typeof refreshDashboardStats === "function") refreshDashboardStats();
      else hideLoader();
      break;
    case "projects":
      if (typeof loadProjects === "function") loadProjects(ctx);
      else hideLoader();
      break;
    case "addProject":
      hideLoader();
      break;
    case "viewProject":
      if (ctx && typeof renderViewProject === "function") renderViewProject(ctx);
      else hideLoader();
      break;
    case "viewTask":
      if (ctx && ctx.taskId && typeof loadTaskView === "function") loadTaskView(ctx.taskId);
      else hideLoader();
      break;
    case "addTask":
      _initAddTaskForm(ctx);
      break;
    case "tasks":
      if (typeof loadTasks === "function") loadTasks();
      else hideLoader();
      break;
    case "revisions":
      if (typeof loadRevisions === "function") loadRevisions();
      else hideLoader();
      break;
    case "addRevision":
      _initAddRevisionForm(ctx);
      break;
    case "vendors":
      if (typeof loadVendors === "function") loadVendors();
      else hideLoader();
      break;
    case "team":
      if (typeof loadTeam === "function") loadTeam();
      else hideLoader();
      break;
    case "vendorView":
      if (ctx && ctx.vendorName && typeof loadVendorView === "function") loadVendorView(ctx.vendorName);
      else hideLoader();
      break;
    case "memberView":
      if (ctx && ctx.memberName && typeof loadMemberView === "function") loadMemberView(ctx.memberName);
      else hideLoader();
      break;
    default:
      hideLoader();
  }
}

function _initAddTaskForm(ctx) {
  /* Auto-fill today as start date for new tasks */
  var sdEl = document.getElementById("task_startDate");
  if (sdEl && !sdEl.value) sdEl.value = todayISO();
  if (typeof initTaskPageCalc === "function") initTaskPageCalc();
  _wireWorkTypeRadios("task_workType", "wt_inhouse_btn", "wt_vendor_btn");
  if (typeof _onPaymentStatusChange === "function") _onPaymentStatusChange();
  if (typeof loadTaskDropdowns === "function") {
    loadTaskDropdowns(function() {
      if (ctx && ctx.projectId) {
        _setVal("task_projectId", ctx.projectId);
        if (typeof lookupTaskProject === "function") lookupTaskProject();
      }
      if (ctx && ctx.editId) {
        var area = document.getElementById("contentArea");
        if (area) area.dataset.editTaskId = ctx.editId;
        if (typeof loadTaskForEdit === "function") loadTaskForEdit(ctx.editId);
      }
      hideLoader();
    });
  } else {
    hideLoader();
  }
}

function _initAddRevisionForm(ctx) {
  var dateEl = document.getElementById("rev_revisionDate");
  if (dateEl && !dateEl.value) dateEl.value = todayISO();
  _wireWorkTypeRadios("rev_workType", "rev_wt_inhouse_btn", "rev_wt_vendor_btn");
  if (typeof loadRevisionDropdowns === "function") {
    loadRevisionDropdowns(function() {
      if (ctx && ctx.projectId) {
        _setVal("rev_projectId", ctx.projectId);
        if (typeof lookupRevisionProject === "function") lookupRevisionProject();
      }
      if (ctx && ctx.editId) {
        var area = document.getElementById("contentArea");
        if (area) area.dataset.editRevId = ctx.editId;
        if (typeof loadRevisionForEdit === "function") loadRevisionForEdit(ctx.editId);
      }
      hideLoader();
    });
  } else {
    if (ctx && ctx.projectId) {
      _setVal("rev_projectId", ctx.projectId);
      if (typeof lookupRevisionProject === "function") lookupRevisionProject();
    }
    hideLoader();
  }
}

function _wireWorkTypeRadios(radioName, inhouseBtnId, vendorBtnId) {
  document.querySelectorAll('input[name="' + radioName + '"]').forEach(function(r) {
    r.addEventListener("change", function() {
      _updateWorkTypeBtns(radioName, inhouseBtnId, vendorBtnId);
      /* Sync assignment field visibility on change */
      if (radioName === "task_workType" && typeof _syncTaskAssignmentFields === "function") _syncTaskAssignmentFields();
      if (radioName === "rev_workType"  && typeof _syncRevAssignmentFields  === "function") _syncRevAssignmentFields();
    });
  });
  _updateWorkTypeBtns(radioName, inhouseBtnId, vendorBtnId);
}

function _updateWorkTypeBtns(radioName, inhouseBtnId, vendorBtnId) {
  var checked = document.querySelector('input[name="' + radioName + '"]:checked');
  var isIH    = checked && checked.value === "In-House";
  var ihBtn   = document.getElementById(inhouseBtnId);
  var vBtn    = document.getElementById(vendorBtnId);
  var BASE    = "flex items-center justify-center gap-2 rounded-xl border-2 py-3 text-sm font-bold transition-all ";
  if (ihBtn) ihBtn.className = BASE + (isIH  ? "border-sky-500 bg-sky-50 text-sky-700"       : "border-gray-200 bg-gray-50 text-gray-400");
  if (vBtn)  vBtn.className  = BASE + (!isIH ? "border-amber-500 bg-amber-50 text-amber-700" : "border-gray-200 bg-gray-50 text-gray-400");
}

function _setActiveNav(page) {
  document.querySelectorAll("[data-nav]").forEach(function(el) {
    var active = el.dataset.nav === page;
    el.classList.toggle("bg-sky-500/15",  active);
    el.classList.toggle("text-sky-300",   active);
    el.classList.toggle("text-slate-300", !active);
  });
}

function toggleSidebar() {
  var sidebar   = document.getElementById("sidebar");
  var main      = document.getElementById("mainContent");
  var labels    = document.querySelectorAll(".nav-label");
  var brand     = document.getElementById("sidebarBrand");
  var collapsed = sidebar.dataset.collapsed === "true";
  if (collapsed) {
    sidebar.style.width = "16rem";
    if (main) main.style.marginLeft = "16rem";
    labels.forEach(function(l) { l.classList.remove("hidden"); });
    if (brand) brand.style.display = "";
    sidebar.dataset.collapsed = "false";
  } else {
    sidebar.style.width = "4rem";
    if (main) main.style.marginLeft = "4rem";
    labels.forEach(function(l) { l.classList.add("hidden"); });
    if (brand) brand.style.display = "none";
    sidebar.dataset.collapsed = "true";
  }
}

function closeEditModal()   { document.getElementById("editModal").style.display   = "none"; }
function closeConfirmModal(){ document.getElementById("confirmModal").style.display = "none"; }

function markCompleteNow() {
  document.getElementById("m_status").value       = "Completed";
  document.getElementById("m_deliveryDate").value = todayISO();
  saveQuickEdit();
}

function saveQuickEdit() {
  var id       = document.getElementById("m_itemId").innerText.trim();
  var status   = document.getElementById("m_status").value;
  var delivery = document.getElementById("m_deliveryDate").value;
  var editType = document.getElementById("editModal").dataset.editType || "task";
  if (!id) { showToast("No item selected.", "error"); return; }
  showLoader("Saving...");
  if (editType === "project") {
    google.script.run
      .withFailureHandler(function(e) { hideLoader(); showToast("Update failed: " + e.message, "error"); })
      .withSuccessHandler(function() {
        hideLoader(); closeEditModal(); showToast("Status updated!", "success");
        /* Patch in-memory + DOM */
        var idx = ALL_PROJECTS.findIndex(function(r){ return r[0]===id; });
        if (idx !== -1) {
          ALL_PROJECTS[idx][9] = status;
          _patchProjectRow(id, ALL_PROJECTS[idx]);
        } else if (typeof loadProjects === "function") { loadProjects(); }
      })
      .updateProjectStatus(id, status);
  } else if (editType === "revision") {
    google.script.run
      .withFailureHandler(function(e) { hideLoader(); showToast("Update failed: " + e.message, "error"); })
      .withSuccessHandler(function() {
        hideLoader(); closeEditModal(); showToast("Revision updated!", "success");
        var idx = ALL_REVISIONS.findIndex(function(r){ return r[0]===id; });
        if (idx !== -1) {
          ALL_REVISIONS[idx][11] = status;
          if (delivery) ALL_REVISIONS[idx][13] = delivery;
          _patchRevisionRow(id, ALL_REVISIONS[idx]);
          _renderRevStats(ALL_REVISIONS);
        } else if (typeof loadRevisions === "function") { loadRevisions(); }
      })
      .updateRevisionStatus(id, status, delivery);
  } else {
    google.script.run
      .withFailureHandler(function(e) { hideLoader(); showToast("Update failed: " + e.message, "error"); })
      .withSuccessHandler(function() {
        hideLoader(); closeEditModal(); showToast("Task updated!", "success");
        var idx = ALL_TASKS.findIndex(function(r){ return r[0]===id; });
        if (idx !== -1) {
          ALL_TASKS[idx][12] = status;
          if (delivery) ALL_TASKS[idx][15] = delivery;
          _patchTaskRow(id, ALL_TASKS[idx]);
          _renderTaskStats(ALL_TASKS);
        } else if (typeof loadTasks === "function") { loadTasks(); }
      })
      .updateTaskStatus(id, status, delivery);
  }
}

function handleRefresh() {
  var btn  = document.getElementById("refreshBtn");
  var icon = document.getElementById("refreshIcon");
  if (btn)  btn.disabled   = true;
  if (icon) icon.innerText = "...";
  var map = {
    dashboard:  function() { if (typeof refreshDashboardStats === "function") refreshDashboardStats(); },
    projects:   function() { if (typeof loadProjects  === "function") loadProjects(); },
    tasks:      function() { if (typeof loadTasks     === "function") loadTasks(); },
    revisions:  function() { if (typeof loadRevisions === "function") loadRevisions(); },
    vendors:    function() { if (typeof loadVendors   === "function") loadVendors(); },
    team:       function() { if (typeof loadTeam      === "function") loadTeam(); },
    viewTask:   function() { if (typeof loadTaskView === "function" && _vtCurrentTaskId) loadTaskView(_vtCurrentTaskId); },
    vendorView: function() { if (typeof _vvFetch      === "function") _vvFetch(); },
    memberView: function() { if (typeof _mvFetch      === "function") _mvFetch(); }
  };
  if (map[_activePage]) map[_activePage]();
  setTimeout(function() {
    if (btn)  btn.disabled   = false;
    if (icon) icon.innerText = "🔄";
    var el = document.getElementById("lastUpdated");
    if (el) el.innerText = new Date().toLocaleTimeString();
  }, 1500);
}
</script>
