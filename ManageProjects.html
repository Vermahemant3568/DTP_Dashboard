<div class="space-y-4 page-enter">

  <!-- HEADER -->
  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
    <div>
      <h2 class="text-xl font-bold text-slate-800">All Projects</h2>
      <p class="text-xs text-slate-400 mt-0.5">Master project registry — select a project to add tasks</p>
    </div>
    <div class="flex items-center gap-2">
      <button onclick="loadPage('addTask')"
        class="inline-flex items-center gap-1.5 bg-sky-600 hover:bg-sky-700 text-white text-xs font-bold px-4 py-2 rounded-lg shadow-sm active:scale-95 transition-all">
        ✅ Add Task
      </button>
      <button onclick="loadPage('addProject')"
        class="inline-flex items-center gap-1.5 bg-white border border-gray-200 hover:bg-gray-50 text-gray-600 text-xs font-semibold px-4 py-2 rounded-lg transition-all">
        ➕ New Project
      </button>
    </div>
  </div>

  <!-- DYNAMIC SUMMARY STATS -->
  <div id="proj_statsBar" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-3">
    <div class="bg-white rounded-xl border border-gray-100 shadow-sm px-4 py-3">
      <p class="text-[10px] font-bold uppercase tracking-wider text-gray-400">Total</p>
      <p id="pstat_total" class="text-2xl font-black text-slate-800 mt-0.5">—</p>
    </div>
    <div class="bg-white rounded-xl border border-gray-100 shadow-sm px-4 py-3">
      <p class="text-[10px] font-bold uppercase tracking-wider text-emerald-500">Active</p>
      <p id="pstat_active" class="text-2xl font-black text-emerald-600 mt-0.5">—</p>
    </div>
    <div class="bg-white rounded-xl border border-gray-100 shadow-sm px-4 py-3">
      <p class="text-[10px] font-bold uppercase tracking-wider text-sky-500">Pending</p>
      <p id="pstat_pending" class="text-2xl font-black text-sky-600 mt-0.5">—</p>
    </div>
    <div class="bg-white rounded-xl border border-gray-100 shadow-sm px-4 py-3">
      <p class="text-[10px] font-bold uppercase tracking-wider text-gray-400">Completed</p>
      <p id="pstat_completed" class="text-2xl font-black text-gray-600 mt-0.5">—</p>
    </div>
    <div class="bg-white rounded-xl border border-gray-100 shadow-sm px-4 py-3">
      <p class="text-[10px] font-bold uppercase tracking-wider text-blue-500">Task Pages</p>
      <p id="pstat_taskpages" class="text-2xl font-black text-blue-600 mt-0.5">—</p>
    </div>
    <div class="bg-white rounded-xl border border-gray-100 shadow-sm px-4 py-3">
      <p class="text-[10px] font-bold uppercase tracking-wider text-amber-500">Rev Pages</p>
      <p id="pstat_revpages" class="text-2xl font-black text-amber-600 mt-0.5">—</p>
    </div>
  </div>

  <!-- FILTERS -->
  <div class="bg-white rounded-xl border border-gray-100 shadow-sm">
    <div class="flex flex-col sm:flex-row gap-2 p-3">
      <div class="relative flex-1">
        <span class="absolute inset-y-0 left-3 flex items-center text-gray-400">
          <svg class="h-3.5 w-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        </span>
        <input type="text" id="proj_search" oninput="filterProjects()"
          placeholder="Search ID, client, project…"
          class="input pl-8 py-2 text-xs">
      </div>
      <select id="proj_statusFilter" onchange="filterProjects()" class="input sm:w-36 py-2 text-xs">
        <option value="">All Statuses</option>
        <option>Active</option>
        <option>Pending</option>
        <option>Completed</option>
        <option>On Hold</option>
        <option>Cancelled</option>
      </select>
      <select id="proj_priorityFilter" onchange="filterProjects()" class="input sm:w-32 py-2 text-xs">
        <option value="">All Priorities</option>
        <option>Low</option>
        <option>Medium</option>
        <option>High</option>
        <option>Urgent</option>
      </select>
      <button onclick="_resetProjFilters()" class="shrink-0 px-3 py-2 text-xs font-semibold bg-gray-100 hover:bg-gray-200 text-gray-600 rounded-lg transition-all">
        Reset
      </button>
    </div>
  </div>

  <!-- TABLE -->
  <div class="bg-white rounded-xl border border-gray-100 shadow-sm overflow-hidden">
    <!-- table meta row -->
    <div class="flex items-center justify-between px-4 py-2.5 border-b border-gray-50">
      <p id="proj_countLabel" class="text-xs text-gray-400 font-medium">Loading…</p>
    </div>
    <div class="overflow-x-auto">
      <table class="data-table">
        <thead>
          <tr>
            <th class="text-left">Project ID</th>
            <th class="text-left">Client &amp; Project</th>
            <th class="text-center">Src Pg</th>
            <th class="text-left">Coordinator</th>
            <th class="text-center">Priority</th>
            <th class="text-center">Status</th>
            <th class="text-center">Tasks</th>
            <th class="text-center">Task Pg</th>
            <th class="text-center">Rev</th>
            <th class="text-center">Rev Pg</th>
            <th class="text-center">Total Pg</th>
            <th class="text-left">Received</th>
            <th class="text-right">Actions</th>
          </tr>
        </thead>
        <tbody id="projectsTable">
          <tr><td colspan="13" class="py-16 text-center text-slate-400 text-sm">Loading projects…</td></tr>
        </tbody>
      </table>
    </div>
  </div>

</div>
