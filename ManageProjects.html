<div class="space-y-5 page-enter">

  <!-- HEADER -->
  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
    <div>
      <h2 class="text-2xl font-bold text-slate-800">All Projects</h2>
      <p class="text-sm text-slate-500 mt-0.5">Master project registry — select a project, then add tasks to it</p>
    </div>
    <div class="flex items-center gap-2">
      <button onclick="loadPage('addTask')"
        class="inline-flex items-center gap-2 bg-sky-600 hover:bg-sky-700 text-white text-sm font-bold px-4 py-2.5 rounded-xl shadow-sm active:scale-95 transition-all">
        ✅ Add Task
      </button>
      <button onclick="loadPage('addProject')"
        class="inline-flex items-center gap-2 bg-white border border-gray-200 hover:bg-gray-50 text-gray-500 text-xs font-medium px-3 py-2.5 rounded-xl transition-all"
        title="Only register if this is a brand new job not already in the list">
        ➕ Register New Project
      </button>
    </div>
  </div>

  <!-- FILTERS -->
  <div class="section-card">
    <div class="flex flex-col sm:flex-row gap-3 p-4">
      <div class="relative flex-1">
        <span class="absolute inset-y-0 left-3 flex items-center text-gray-400">
          <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        </span>
        <input type="text" id="proj_search" oninput="filterProjects()"
          placeholder="Search by ID, client, or project name…"
          class="input pl-9">
      </div>
      <select id="proj_statusFilter" onchange="filterProjects()" class="input sm:w-40">
        <option value="">All Statuses</option>
        <option>Active</option>
        <option>Pending</option>
        <option>Completed</option>
        <option>On Hold</option>
        <option>Cancelled</option>
      </select>
      <select id="proj_priorityFilter" onchange="filterProjects()" class="input sm:w-36">
        <option value="">All Priorities</option>
        <option>Low</option>
        <option>Medium</option>
        <option>High</option>
        <option>Urgent</option>
      </select>
    </div>
  </div>

  <!-- TABLE -->
  <div class="section-card overflow-hidden">
    <div class="overflow-x-auto">
      <table class="data-table">
        <thead>
          <tr>
            <th>Project ID</th>
            <th>Client & Project</th>
            <th>Languages</th>
            <th>Coordinator</th>
            <th>Priority</th>
            <th>Status</th>
            <th class="text-center">Tasks</th>
            <th class="text-center">Task Pages</th>
            <th>Received</th>
            <th class="text-right">Actions</th>
          </tr>
        </thead>
        <tbody id="projectsTable">
          <tr><td colspan="10" class="py-16 text-center text-slate-400 text-sm">Loading projects…</td></tr>
        </tbody>
      </table>
    </div>
  </div>

</div>
