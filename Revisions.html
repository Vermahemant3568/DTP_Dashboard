<div class="space-y-5 page-enter">

  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
    <div>
      <h2 class="text-2xl font-bold text-slate-800">Revisions</h2>
      <p class="text-sm text-slate-500 mt-0.5">All revision rounds — tracked separately from DTP task pages</p>
    </div>
    <button onclick="loadPage('addRevision')"
      class="inline-flex items-center gap-2 bg-purple-600 hover:bg-purple-700 text-white text-sm font-semibold px-4 py-2.5 rounded-xl shadow-sm active:scale-95 transition-all">
      🔁 Add Revision
    </button>
  </div>

  <!-- STATS -->
  <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
    <div class="stat-card border-l-4 border-l-purple-500">
      <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Total Revisions</p>
      <p id="rev_stat_total" class="text-2xl font-bold text-slate-700 mt-1">—</p>
    </div>
    <div class="stat-card border-l-4 border-l-violet-500">
      <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Revision Pages</p>
      <p id="rev_stat_pages" class="text-2xl font-bold text-violet-600 mt-1">—</p>
    </div>
    <div class="stat-card border-l-4 border-l-yellow-500">
      <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Pending</p>
      <p id="rev_stat_pending" class="text-2xl font-bold text-yellow-500 mt-1">—</p>
    </div>
    <div class="stat-card border-l-4 border-l-green-500">
      <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Completed</p>
      <p id="rev_stat_done" class="text-2xl font-bold text-green-500 mt-1">—</p>
    </div>
  </div>

  <!-- FILTERS -->
  <div class="section-card">
    <div class="flex flex-wrap gap-3 p-4">
      <div class="relative flex-1 min-w-[200px]">
        <span class="absolute inset-y-0 left-3 flex items-center text-gray-400">
          <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        </span>
        <input type="text" id="rev_search" oninput="filterRevisions()"
          placeholder="Search by project, language, ID…"
          class="input pl-9">
      </div>
      <select id="rev_statusFilter" onchange="filterRevisions()" class="input w-36">
        <option value="">All Statuses</option>
        <option>Pending</option>
        <option>In Progress</option>
        <option>Completed</option>
      </select>
      <select id="rev_typeFilter" onchange="filterRevisions()" class="input w-44">
        <option value="">All Types</option>
        <option>Client Feedback</option>
        <option>QC Round</option>
        <option>Addition</option>
        <option>Correction</option>
      </select>
      <select id="rev_workFilter" onchange="filterRevisions()" class="input w-36">
        <option value="">All Work Types</option>
        <option>In-House</option>
        <option>Vendor</option>
      </select>
    </div>
  </div>

  <!-- TABLE -->
  <div class="section-card overflow-hidden">
    <div class="overflow-x-auto">
      <table class="data-table">
        <thead>
          <tr>
            <th>Revision ID</th>
            <th>Project</th>
            <th>Task</th>
            <th>Rev # / Type</th>
            <th>Language</th>
            <th>Assigned / Vendor</th>
            <th>Work Type</th>
            <th>Status</th>
            <th class="text-center">Pages</th>
            <th>Rev Date</th>
            <th class="text-right">Actions</th>
          </tr>
        </thead>
        <tbody id="revisionsTable">
          <tr><td colspan="11" class="py-16 text-center text-slate-400 text-sm">Loading revisions…</td></tr>
        </tbody>
      </table>
    </div>
  </div>

</div>
